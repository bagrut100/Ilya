<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>מטען, שדה ופוטנציאל (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* layout: a bench electroscope page. sticky bar, one reading column, the live field canvas at the centre of each topic. red = positive, blue = negative, copper = equipotential and UI accent. */
:root{
  --bg:#f2f4f7; --paper:#ffffff; --soft:#eef1f5; --ink:#17202c; --mut:#5a6576; --line:#d8dee7; --grid:#e9edf3;
  --pos:#cf3328; --neg:#2860c4; --acc:#a85a14; --acc-ink:#ffffff; --fieldln:#3a4557;
  --ok:#14713f; --ok-bg:#e2f3e9; --no:#b3261e; --no-bg:#fbe7e5; --warn:#7a4a00; --warn-bg:#fff2d6;
  --shadow:0 1px 2px rgba(23,32,44,.05),0 8px 24px rgba(23,32,44,.07);
  --fd:"Secular One","Assistant",system-ui,sans-serif;
  --fb:"Assistant","Arial Hebrew",system-ui,sans-serif;
  --fm:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1117; --paper:#151b24; --soft:#1b2330; --ink:#e6ebf2; --mut:#9aa5b6; --line:#2a3342; --grid:#1c2431;
  --pos:#ff6a5c; --neg:#6aa1ff; --acc:#f0a14a; --acc-ink:#1a1206; --fieldln:#b7c2d4;
  --ok:#5fd394; --ok-bg:#122b1d; --no:#ff8b80; --no-bg:#371816; --warn:#f2c46e; --warn-bg:#2e240f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1117; --paper:#151b24; --soft:#1b2330; --ink:#e6ebf2; --mut:#9aa5b6; --line:#2a3342; --grid:#1c2431;
  --pos:#ff6a5c; --neg:#6aa1ff; --acc:#f0a14a; --acc-ink:#1a1206; --fieldln:#b7c2d4;
  --ok:#5fd394; --ok-bg:#122b1d; --no:#ff8b80; --no-bg:#371816; --warn:#f2c46e; --warn-bg:#2e240f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--fb);-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{text-decoration:none;margin-inline-end:auto;display:flex;align-items:center;gap:10px;font:400 1.3rem/1 var(--fd)}
.brand i{display:inline-flex;gap:3px}
.brand i b{width:12px;height:12px;border-radius:50%;display:block}
.nl{font-weight:700;font-size:.95rem;text-decoration:none;padding:8px 12px;border-radius:999px}
.nl:hover,.nl[aria-current]{background:var(--soft)}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700;font-size:.95rem;line-height:1.3;display:inline-flex;align-items:center;gap:6px;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.88rem}
.btn.pos{color:var(--pos)} .btn.neg{color:var(--neg)}

/* home */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:32px;align-items:center;padding-block:34px 20px}
.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--acc)}
.hero h1{font-size:clamp(2.3rem,6vw,3.6rem);margin-block:6px 12px}
.hero h1 .p{color:var(--pos)} .hero h1 .n{color:var(--neg)}
.lead{font-size:1.1rem;color:var(--mut);max-width:32em}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hfig{margin:0;min-width:0}
.hfig .stage canvas{height:300px}
.hfig figcaption{font-size:.86rem;color:var(--mut);margin-top:8px}
.secth{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-top:22px;flex-wrap:wrap}
.secth h2{font-size:1.6rem}
.secth span{color:var(--mut);font-size:.92rem}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.tc{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-content:start;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;transition:border-color .15s,transform .15s}
.tc:hover{border-color:var(--acc);transform:translateY(-2px)}
.tn{font:400 1.5rem/1.1 var(--fd);color:var(--acc);font-variant-numeric:tabular-nums}
.tc b{font-size:1.08rem;line-height:1.35}
.tc .ts{grid-column:2;color:var(--mut);font-size:.9rem;line-height:1.45}
.tc .pg{grid-column:2;margin-top:8px;font-size:.8rem;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.pg em{font-style:normal;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* topic */
.th{padding-block:24px 12px}
.crumb{font-size:.88rem;font-weight:700;color:var(--acc);text-decoration:none}
.th h1{font-size:clamp(1.9rem,5vw,2.7rem);margin-block:4px 4px}
.th p{color:var(--mut);font-size:1.05rem}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:5;background:var(--bg);display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 16px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;flex:1 0 auto;min-height:46px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.panel{padding-block:22px 8px;display:grid;gap:22px;min-width:0}
.prose{max-width:66ch;display:grid;gap:12px;font-size:1.05rem}
.prose p,.ex p,.q p,.sol p,.trap p{min-width:0;overflow-wrap:anywhere}
.panel h2{font-size:1.3rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.fc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 10px 10px;text-align:center;min-width:0;display:grid;gap:4px;align-content:center}
.fc small{color:var(--mut);font-size:.86rem;line-height:1.45}
.trap{background:var(--warn-bg);border-radius:14px;padding:16px 18px;max-width:72ch;display:grid;gap:6px}
.trap h2{font-size:1.1rem;color:var(--warn)}
.tips{background:var(--paper);border:1px solid var(--line);border-inline-start:4px solid var(--acc);border-radius:14px;padding:16px 18px;max-width:72ch;display:grid;gap:8px}
.tips h2{font-size:1.1rem;color:var(--acc)}
.tips ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.tips li{position:relative;padding-inline-start:22px;min-width:0;overflow-wrap:anywhere}
.tips li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:9px;height:9px;border-radius:50%;border:2px solid var(--acc)}

/* lab */
.stage{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.stage canvas{display:block;width:100%;height:380px;touch-action:none;cursor:grab}
.stage canvas.g{height:190px;cursor:default;border-top:1px solid var(--line)}
.hint{position:absolute;inset-inline-end:10px;top:8px;font-size:.78rem;color:var(--mut);background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:1px 10px;pointer-events:none;max-width:calc(100% - 20px)}
.simbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.simbar .lab{font-size:.88rem;color:var(--mut);font-weight:600}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--paper);cursor:pointer}
.tgl input{accent-color:var(--acc);margin:0}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 26px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:baseline;min-width:0}
.ctl .cl{font-size:.95rem;font-weight:600}
.ctl output{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);direction:ltr;unicode-bidi:isolate}
.ctl input{grid-column:1/-1;width:100%;accent-color:var(--acc);height:30px;margin:0}
.outs{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.outs div{background:var(--soft);border-radius:10px;padding:8px 12px;min-width:0}
.outs dt{font-size:.82rem;color:var(--mut);line-height:1.4}
.outs dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.02rem;direction:ltr;text-align:right;font-family:var(--fm)}
.note{font-size:.9rem;color:var(--mut);max-width:72ch}

/* example */
.ex{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;max-width:80ch}
.ex h3,.qn{font:700 .82rem/1.3 var(--fb);letter-spacing:.06em;color:var(--acc)}
.gf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gf>div{background:var(--soft);border-radius:10px;padding:10px 14px;min-width:0;display:grid;gap:4px}
.steps{margin:0;padding-inline-start:1.4em;display:grid;gap:12px}
.steps li{min-width:0}
.steps li::marker{font-family:var(--fd);color:var(--acc)}
.chk{background:var(--ok-bg);border-radius:10px;padding:10px 14px;display:grid;gap:4px}
.chk h3{color:var(--ok)}

/* practice */
.lvl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.lvl h2{font-size:1.25rem}
.lvl span{color:var(--mut);font-size:.9rem}
.q{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;max-width:80ch}
.q.adv{border-inline-start:4px solid var(--acc)}
.qn{display:flex;justify-content:space-between;gap:8px}
.qn .st{letter-spacing:0;font-weight:700}
.qn .st.ok{color:var(--ok)}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:start;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);font-weight:700}
.opt.no{border-color:var(--no);background:var(--no-bg);color:var(--mut)}
.fb{font-size:.97rem;padding:10px 14px;border-radius:10px;background:var(--soft)}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--no-bg)}
.ansrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ansrow input{width:10em;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums;font-size:1rem;direction:ltr;text-align:left}
.ansrow .u{color:var(--mut);font-weight:600;direction:ltr;unicode-bidi:isolate}
.tip{font-size:.84rem;color:var(--mut)}
.sol{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:.98rem;display:grid;gap:8px}
.fig{max-width:360px;width:100%;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
.score{font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:18px;margin-top:10px}

/* formulas */
.ftab{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ftab td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.ftab td.fx{text-align:center;width:46%}
.ftab small{display:block;color:var(--mut);font-size:.85rem}
.ftab a{font-size:.84rem;font-weight:700;color:var(--acc);text-decoration:none}
.tscroll{overflow-x:auto}
.foot{color:var(--mut);font-size:.86rem;padding-block:24px 34px;border-top:1px solid var(--line);margin-top:30px}

/* math */
.mx{font-family:var(--fm);font-size:1.08em;direction:ltr;unicode-bidi:isolate;display:inline-block;line-height:1.3;white-space:nowrap}
.mx i{font-style:italic}
.mx.fx{display:block;text-align:center;font-size:1.3rem;overflow-x:auto;overflow-y:hidden;padding:6px 2px;max-width:100%}
.mx sup,.mx sub{font-size:.68em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.95em}
.fr>span:first-child{border-bottom:1.2px solid currentColor;padding:0 .25em .08em}
.fr>span:last-child{padding:.08em .25em 0}
.pq{color:var(--pos);font-weight:700} .nq{color:var(--neg);font-weight:700}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:18px;padding-block:22px 10px}
  .gf{grid-template-columns:1fr}
  .stage canvas{height:320px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div dir="rtl" lang="he">
<header class="bar"><div class="wrap">
  <a class="brand" href="#"><i aria-hidden="true"><b style="background:var(--pos)"></b><b style="background:var(--neg)"></b></i>מטען, שדה ופוטנציאל</a>
  <a class="nl" href="#" id="nav-home">נושאים</a>
  <a class="nl" href="#formulas" id="nav-f">נוסחאות</a>
</div></header>
<main id="app"></main>
<footer class="wrap foot">יחידת לימוד באלקטרוסטטיקה, פיזיקה 5 יח״ל. הסימונים לפי דף הנוסחאות של התלמיד. בחישובים: <span class="mx"><i>k</i> = 9·10<sup>9</sup> N·m<sup>2</sup>/C<sup>2</sup></span>, <span class="mx"><i>e</i> = 1.6·10<sup>−19</sup> C</span>, <span class="mx"><i>g</i> = 10 m/s<sup>2</sup></span>.</footer>
</div>

<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';
const K=9e9, MU=1e-6, E0=8.85e-12;
const m=s=>`<span class="mx">${s}</span>`;
const M=s=>`<div class="mx fx">${s}</div>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sc=(a,e)=>`${a}·10<sup>${String(e).replace('-','−')}</sup>`;
const q1='<i>q</i><sub>1</sub>', q2='<i>q</i><sub>2</sub>';

/* ---------- number formatting ---------- */
function fmt(x,d=3){
  if(!isFinite(x))return '—'; if(Math.abs(x)<1e-30)return '0';
  const a=Math.abs(x);
  if(a>=1e4||a<1e-2){let e=Math.floor(Math.log10(a));let mn=+(x/10**e).toPrecision(d);if(Math.abs(mn)>=10){mn=+(mn/10).toPrecision(d);e++}return (String(mn)+'·10<sup>'+e+'</sup>').replace(/-/g,'−')}
  return String(+x.toPrecision(d)).replace('-','−');
}
function parseNum(s){
  if(!s)return NaN; s=s.trim().replace(/[−–]/g,'-').replace(/\s/g,'').replace(/,/g,'.');
  s=s.replace(/(?:\*|x|×|·)10\^?\(?(-?\d+)\)?/i,'e$1').replace(/^10\^?(-?\d+)$/,'1e$1');
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)?parseFloat(s):NaN;
}

/* ---------- storage ---------- */
let solved={};
try{solved=JSON.parse(localStorage.getItem('es-solved')||'{}')||{}}catch(e){solved={}}
function markSolved(id){solved[id]=1;try{localStorage.setItem('es-solved',JSON.stringify(solved))}catch(e){}}

/* ---------- physics ---------- */
function Ef(ch,x,y){let ex=0,ey=0;for(const c of ch){const dx=x-c.x,dy=y-c.y;let r2=dx*dx+dy*dy;if(r2<1e-7)r2=1e-7;const r=Math.sqrt(r2),e=K*c.q*MU/r2;ex+=e*dx/r;ey+=e*dy/r}return[ex,ey]}
function Vf(ch,x,y){let v=0;for(const c of ch){let r=Math.hypot(x-c.x,y-c.y);if(r<1e-4)r=1e-4;v+=K*c.q*MU/r}return v}

/* ---------- canvas helpers ---------- */
function tok(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();return{paper:g('--paper'),ink:g('--ink'),mut:g('--mut'),line:g('--line'),grid:g('--grid'),pos:g('--pos'),neg:g('--neg'),acc:g('--acc'),fl:g('--fieldln'),ok:g('--ok'),soft:g('--soft')}}
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function arrow(ctx,x1,y1,x2,y2,col,w=2,head=8){const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1);if(L<2)return;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*head*.6,y2-Math.sin(a)*head*.6);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.42),y2-head*Math.sin(a-.42));ctx.lineTo(x2-head*Math.cos(a+.42),y2-head*Math.sin(a+.42));ctx.closePath();ctx.fill()}
const lenE=E=>Math.min(130,Math.max(10,14+26*Math.log10(Math.max(E,1e3)/1e3)));
const lenF=F=>Math.min(130,Math.max(10,14+28*Math.log10(Math.max(F,1e-3)/1e-3)));
function font(ctx,sz,w=700){ctx.font=`${w} ${sz}px Assistant, system-ui, sans-serif`}

let scenes=[];
function killScenes(){scenes.forEach(s=>s.ro&&s.ro.disconnect());scenes=[]}
const themeMQ=matchMedia('(prefers-color-scheme: dark)');
const redrawAll=()=>scenes.forEach(s=>s.draw());
themeMQ.addEventListener&&themeMQ.addEventListener('change',redrawAll);
new MutationObserver(redrawAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* generic canvas wrapper */
function Canvas(cv,drawFn){
  const o={cv,ctx:cv.getContext('2d'),W:0,H:0,draw(){if(!o.W)return;const c=o.ctx;c.setTransform(o.dpr,0,0,o.dpr,0,0);const t=tok();c.fillStyle=t.paper;c.fillRect(0,0,o.W,o.H);drawFn(c,t,o)}};
  o.resize=()=>{const r=cv.getBoundingClientRect();if(!r.width)return;o.dpr=Math.min(2,devicePixelRatio||1);o.W=r.width;o.H=r.height;cv.width=Math.round(r.width*o.dpr);cv.height=Math.round(r.height*o.dpr);o.onResize&&o.onResize();o.draw()};
  o.ro=new ResizeObserver(o.resize);o.ro.observe(cv);scenes.push(o);return o;
}

/* charge scene */
function Scene(cv,opt){
  const S=Object.assign({width:1.1,lines:false,equip:false,heat:false,vstep:2e4,charges:[],probes:[],sel:null,selectable:false},opt);
  const base=Canvas(cv,(ctx,t,o)=>render(ctx,t));
  Object.assign(base,S);const sc=base;
  sc.onResize=()=>{sc.s=sc.W/sc.width;sc.cx=sc.W/2;sc.cy=sc.H/2};
  sc.px=(x,y)=>[sc.cx+x*sc.s,sc.cy-y*sc.s];
  sc.w=(X,Y)=>[(X-sc.cx)/sc.s,(sc.cy-Y)/sc.s];
  function render(ctx,t){
    // grid every 0.1 m
    ctx.strokeStyle=t.grid;ctx.lineWidth=1;ctx.beginPath();
    for(let x=0;x<=sc.width/2+.001;x+=.1){for(const sg of[1,-1]){const X=sc.cx+sg*x*sc.s;ctx.moveTo(X,0);ctx.lineTo(X,sc.H)}}

function builder(host,preset,o){
  host.innerHTML=`<div class="stage"><canvas aria-label="בניית מערכת מטענים עם קווי שדה וקווים שווי פוטנציאל"></canvas><span class="hint">גררו מטענים · לחיצה על מטען בוחרת אותו</span></div>
  <div class="simbar"><span class="lab">מוכנים:</span></div><div class="simbar"></div><div class="ctls"></div>`;
  const [pre,bar]=host.querySelectorAll('.simbar'),ctls=host.querySelector('.ctls');
  const sc=Scene(host.querySelector('canvas'),{width:1.1,charges:[],lines:o.lines,equip:o.equip,vstep:3e4,selectable:true,
    onSelect(c){sl.set(c.q)}});
  const presets={'דיפול':[[-.18,0,2],[.18,0,-2]],'שני מטענים חיוביים':[[-.18,0,2],[.18,0,2]],'‎+2q ו־‎−q':[[-.15,0,2],[.15,0,-1]],'מטען יחיד':[[0,0,2]],'"לוחות"':[...[-4,-3,-2,-1,0,1,2,3,4].map(i=>[-.14,i*.045,.5]),...[-4,-3,-2,-1,0,1,2,3,4].map(i=>[.14,i*.045,-.5])]};
  const load=k=>{sc.charges.length=0;presets[k].forEach(([x,y,q])=>sc.charges.push({x,y,q}));sc.sel=sc.charges[0];sl.set(sc.sel.q);sc.draw()};
  Object.keys(presets).forEach(k=>{const b=el(`<button class="btn sm">${k}</button>`);b.onclick=()=>load(k);pre.appendChild(b)});
  const add=q=>{const c={x:+(Math.random()*.5-.25).toFixed(3),y:+(Math.random()*.3-.15).toFixed(3),q};sc.charges.push(c);sc.sel=c;sl.set(q);sc.draw()};
  const bp=el(`<button class="btn sm pos">+ מטען חיובי</button>`);bp.onclick=()=>add(1);bar.appendChild(bp);
  const bn=el(`<button class="btn sm neg">+ מטען שלילי</button>`);bn.onclick=()=>add(-1);bar.appendChild(bn);
  const bd=el(`<button class="btn sm">מחיקת הנבחר</button>`);bd.onclick=()=>{const i=sc.charges.indexOf(sc.sel);if(i>=0)sc.charges.splice(i,1);sc.sel=sc.charges[0]||null;sc.sel&&sl.set(sc.sel.q);sc.draw()};bar.appendChild(bd);
  toggle(bar,'קווי שדה',o.lines,v=>{sc.lines=v;sc.draw()});
  toggle(bar,'קווים שווי פוטנציאל',o.equip,v=>{sc.equip=v;sc.draw()});
  toggle(bar,'מפת צבע של V',false,v=>{sc.heat=v;sc.draw()});
  const sl=slider(ctls,'מטען נבחר',-5,5,.5,2,qs,v=>{if(sc.sel){sc.sel.q=v;sc.draw()}});
  host.appendChild(el(`<p class="note">מספר הקווים שיוצאים מכל מטען יחסי לגודלו (4 קווים לכל μC). הקווים שווי הפוטנציאל מצוירים בהפרשים שווים של 30 kV, והקו המודגש הוא <span class="mx"><i>V</i> = 0</span>.</p>`));
  load(o.name==='equipotential'&&!preset?'דיפול':preset?(o.name==='lines'?'‎+2q ו־‎−q':'מטען יחיד'):'דיפול');
}

 intro:[
 `מטען יוצר סביבו <b>שדה חשמלי</b>. כל מטען אחר שנמצא בשדה מרגיש כוח.`,
 `השדה בנקודה הוא הכוח שפועל על מטען בוחן חיובי, מחולק בגודל המטען. לכן הכוח על מטען ${m('<i>q</i>')} הוא ${m('<i>F</i> = <i>qE</i>')}. על מטען חיובי הכוח בכיוון השדה, ועל מטען שלילי הוא בכיוון ההפוך.`,
 `שדה של מטען נקודתי מצביע החוצה ממטען חיובי ופנימה אל מטען שלילי, וגודלו ${m(`<i>k</i>${fr('<i>q</i>','<i>r</i><sup>2</sup>')}`)}.`,
 `השדה תלוי רק במטענים שיוצרים אותו ובמיקום הנקודה. הוא לא תלוי במטען הבוחן שמכניסים כדי למדוד אותו.`,
 `השדה של כמה מטענים הוא הסכום הווקטורי של השדות של כל מטען.`,
 `לוח גדול (אינסופי) עם צפיפות מטען משטחית ${m('<i>σ</i>')} יוצר שדה אחיד, ניצב ללוח, שאינו תלוי במרחק מהלוח. בין שני לוחות מקבילים בעלי מטענים הפוכים השדות מתחברים, ${m('<i>E</i> = <i>σ</i>/<i>ε</i><sub>0</sub>')}, ומחוץ ללוחות הם מבטלים זה את זה. בהרחבה בנושא "לוחות טעונים".`],
 formulas:[[`<i>F</i> = <i>qE</i>`,'כוח על מטען בשדה חשמלי (וקטורי)'],[`<i>E</i> = <i>k</i>${fr('<i>q</i>','<i>r</i><sup>2</sup>')}`,'גודל השדה סביב מטען נקודתי'],[`<i>E</i> = 2π<i>kσ</i> = ${fr('<i>σ</i>','2<i>ε</i><sub>0</sub>')}`,`שדה של לוח טעון, ${m(`<i>σ</i> = ${fr('<i>Q</i>','<i>A</i>')}`)}`]],
 trap:[`איפה השדה מתאפס?`,`בין שני מטענים <b>בעלי סימן זהה</b> השדות מנוגדים, ונקודת האפס נמצאת בין המטענים, קרוב יותר למטען הקטן. כשהסימנים <b>הפוכים</b>, בין המטענים השדות באותו כיוון ולא מתבטלים. נקודת האפס נמצאת מחוץ לקטע, מאחורי המטען שגודלו קטן יותר.`],
 ex:{given:[`${m(q1+' = +4 μC')} בנקודה ${m('<i>x</i> = 0')}`,`${m(q2+' = −1 μC')} בנקודה ${m('<i>x</i> = 0.3 m')}`],ask:[`א. מה השדה (גודל וכיוון) בנקודה האמצעית ${m('<i>x</i> = 0.15 m')}?`,`ב. מה הכוח על אלקטרון שמונח שם?`,`ג. באיזו נקודה על ציר x השדה מתאפס?`],
  steps:[
  `<b>שדה של q₁:</b> ${M(`<i>E</i><sub>1</sub> = 9·10<sup>9</sup>·${fr('4·10<sup>−6</sup>','0.15<sup>2</sup>')} = 1.6·10<sup>6</sup> N/C`)} המטען חיובי, ולכן השדה מצביע ממנו והלאה, בכיוון ${m('+<i>x</i>')}.`,
  `<b>שדה של q₂:</b> ${m(`<i>E</i><sub>2</sub> = 9·10<sup>9</sup>·${fr('1·10<sup>−6</sup>','0.15<sup>2</sup>')} = 4·10<sup>5</sup> N/C`)}. המטען שלילי, ולכן השדה מצביע אליו, שוב בכיוון ${m('+<i>x</i>')}.`,
  `<b>סכום:</b> שני השדות באותו כיוון, לכן ${m('<i>E</i> = 2.0·10<sup>6</sup> N/C')} בכיוון ${m('+<i>x</i>')}.`,
  `<b>סעיף ב.</b> ${m('<i>F</i> = <i>eE</i> = 1.6·10<sup>−19</sup>·2·10<sup>6</sup> = 3.2·10<sup>−13</sup> N')}. האלקטרון שלילי, ולכן הכוח בכיוון ${m('−<i>x</i>')}, נגד השדה.`,
  `<b>סעיף ג.</b> הסימנים הפוכים, ולכן נקודת האפס נמצאת מחוץ לקטע, מאחורי המטען הקטן, כלומר ב־${m('<i>x</i> &gt; 0.3 m')}. ${M(`${fr('4','<i>x</i><sup>2</sup>')} = ${fr('1','(<i>x</i> − 0.3)<sup>2</sup>')} ⇒ 2(<i>x</i> − 0.3) = <i>x</i> ⇒ <i>x</i> = 0.6 m`)}`],
  check:`ב־${m('<i>x</i> = 0.6 m')}: ${m('<i>E</i><sub>1</sub> = 9·10<sup>9</sup>·4·10<sup>−6</sup>/0.36 = 10<sup>5</sup> N/C')} ו־${m('<i>E</i><sub>2</sub> = 9·10<sup>9</sup>·10<sup>−6</sup>/0.09 = 10<sup>5</sup> N/C')}, בכיוונים הפוכים.`},
 qs:[
 {l:'b',t:'num',q:`מה גודל השדה החשמלי במרחק ${m('0.2 m')} ממטען נקודתי של ${m('+2 μC')}?`,a:4.5e5,u:'N/C',s:`${m(`<i>E</i> = 9·10<sup>9</sup>·${fr('2·10<sup>−6</sup>','0.2<sup>2</sup>')} = 4.5·10<sup>5</sup> N/C`)}`},
 {l:'b',t:'mc',q:`בנקודה P השדה החשמלי הוא ${m('3000 N/C')} מזרחה. מניחים בה אלקטרון. מה הכוח עליו?`,o:['4.8·10⁻¹⁶ N מזרחה','4.8·10⁻¹⁶ N מערבה','3000 N מערבה','1.9·10²² N מזרחה'],a:1,s:`${m('<i>F</i> = <i>eE</i> = 1.6·10<sup>−19</sup>·3000 = 4.8·10<sup>−16</sup> N')}. מטען שלילי מרגיש כוח נגד כיוון השדה, כלומר מערבה.`},
 {l:'b',t:'mc',q:`מכפילים את המטען הבוחן שמניחים בנקודה P. מה קורה לשדה החשמלי ב־P?`,o:['גדל פי 2','קטן פי 2','לא משתנה','גדל פי 4'],a:2,s:`השדה נוצר על ידי המטענים האחרים ולא תלוי במטען הבוחן. הכוח על הבוחן אכן גדל פי 2, אבל ${m('<i>E</i> = <i>F</i>/<i>q</i>')} נשאר זהה.`},
 {l:'b',t:'mc',q:`לוח גדול טעון במטען אחיד. נקודה A נמצאת במרחק ${m('1 cm')} מהלוח, ונקודה B במרחק ${m('2 cm')} ממנו. מה היחס ${m('<i>E</i><sub>A</sub>/<i>E</i><sub>B</sub>')}?`,o:['4','2','1','½'],a:2,s:`שדה של לוח גדול הוא ${m('<i>E</i> = 2π<i>kσ</i>')}, ואין בו תלות במרחק. בקרבת הלוח השדה אחיד.`},
 {l:'a',t:'num',q:`שני מטענים של ${m('+5 μC')} נמצאים בנקודות ${m('(−0.3, 0) m')} ו־${m('(0.3, 0) m')}. מה גודל השדה בנקודה ${m('(0, 0.4) m')}?`,a:2.88e5,u:'N/C',s:`המרחק מכל מטען לנקודה הוא ${m('0.5 m')}, ולכן ${m(`<i>E</i><sub>1</sub> = <i>E</i><sub>2</sub> = 9·10<sup>9</sup>·${fr('5·10<sup>−6</sup>','0.25')} = 1.8·10<sup>5</sup> N/C`)}.<br>הרכיבים האופקיים מתבטלים מסיבות סימטריה. הרכיבים האנכיים: ${m('1.8·10<sup>5</sup>·(0.4/0.5) = 1.44·10<sup>5</sup>')} כל אחד.<br>${m('<i>E</i> = 2·1.44·10<sup>5</sup> = 2.88·10<sup>5</sup> N/C')}, כלפי מעלה.`},
 {l:'a',t:'num',q:`טיפת שמן במסה ${m('4.8·10<sup>−15</sup> kg')} מרחפת במנוחה בשדה חשמלי אחיד ואנכי של ${m('1.5·10<sup>5</sup> N/C')}. לטיפה עודף אלקטרונים. כמה אלקטרונים עודפים יש לה?`,a:2,u:'אלקטרונים',s:`בשיווי משקל ${m('<i>qE</i> = <i>mg</i>')}, ולכן ${m(`<i>q</i> = ${fr('4.8·10<sup>−15</sup>·10','1.5·10<sup>5</sup>')} = 3.2·10<sup>−19</sup> C`)}.<br>${m('<i>n</i> = 3.2·10<sup>−19</sup>/1.6·10<sup>−19</sup> = 2')}. הטיפה שלילית והכוח החשמלי עליה כלפי מעלה, ולכן השדה מצביע כלפי מטה.`},
 {l:'a',t:'num',q:`${m(q1+' = +1 μC')} נמצא בנקודה ${m('<i>x</i> = 0')}, ו־${m(q2+' = +9 μC')} בנקודה ${m('<i>x</i> = 0.4 m')}. באיזו נקודה על ציר x השדה מתאפס? (תשובה ב־m)`,a:.1,u:'m',s:`הסימנים זהים, ולכן הנקודה נמצאת בין המטענים, קרוב יותר למטען הקטן. ${M(`${fr('1','<i>x</i><sup>2</sup>')} = ${fr('9','(0.4 − <i>x</i>)<sup>2</sup>')} ⇒ 0.4 − <i>x</i> = 3<i>x</i> ⇒ <i>x</i> = 0.1 m`)}`}
 ]},
{id:'energy',title:'אנרגיה פוטנציאלית חשמלית',sub:'אנרגיה של מערכת שני מטענים',
 intro:[
 `למערכת של שני מטענים נקודתיים יש אנרגיה פוטנציאלית חשמלית ${m(`<i>U</i><sub>E</sub> = <i>k</i>${fr(q1+q2,'<i>r</i>')}`)}. נקודת האפס נקבעת כשהמטענים רחוקים מאוד זה מזה: ${m('<i>U</i><sub>E</sub>(<i>r</i>→∞) = 0')}.`,
 `האנרגיה היא סקלר עם סימן. היא <b>חיובית</b> למטענים בעלי סימן זהה, כי צריך להשקיע עבודה כדי לקרב אותם. היא <b>שלילית</b> למטענים בעלי סימנים הפוכים, כי צריך להשקיע עבודה כדי להפריד אותם.`,
 `כשרק כוחות חשמליים עושים עבודה, האנרגיה המכנית נשמרת: ${m('Δ<i>E</i><sub>k</sub> = −Δ<i>U</i><sub>E</sub>')}. מטענים דוחים שמתרחקים צוברים אנרגיה קינטית.`,
 `האנרגיה של מטען ${m('<i>q</i>')} בנקודה שבה הפוטנציאל הוא ${m('<i>V</i>')}: ${m('<i>U</i><sub>E</sub> = <i>qV</i>')}.`],
 formulas:[[`<i>U</i><sub>E</sub> = <i>k</i>${fr(q1+q2,'<i>r</i>')}`,'מערכת שני מטענים, אפס באינסוף'],[`<i>U</i><sub>E</sub> = <i>qV</i>`,'מטען בנקודה שבה הפוטנציאל V'],[`<i>W</i><sub>חשמלי</sub> = −Δ<i>U</i><sub>E</sub>`,'עבודת הכוח החשמלי']],
 trap:[`סימנים באנרגיה`,`בחישוב <b>כוח</b> מציבים גודלי מטענים וקובעים את הכיוון לפי ההיגיון. בחישוב <b>אנרגיה</b> מציבים את המטענים עם הסימנים שלהם, והסימן של התוצאה הוא חלק מהתשובה.`],
 ex:{given:[`${m(q1+' = +2 μC')} מקובע במקומו`,`${m(q2+' = +3 μC')}, מסה ${m('2 g')}, משוחרר ממנוחה במרחק ${m('0.1 m')}`],ask:[`מה תהיה מהירות ${m('<i>q</i><sub>2</sub>')} כשיהיה רחוק מאוד מ־${m('<i>q</i><sub>1</sub>')}?`],
  steps:[
  `<b>אנרגיה בהתחלה:</b> ${M(`<i>U</i> = 9·10<sup>9</sup>·${fr('2·10<sup>−6</sup>·3·10<sup>−6</sup>','0.1')} = 0.54 J`)}`,
  `<b>שימור אנרגיה:</b> באינסוף ${m('<i>U</i> = 0')}, ולכן כל 0.54 J הופכים לאנרגיה קינטית: ${m(`${fr('1','2')}<i>mv</i><sup>2</sup> = 0.54`)}.`,
  `${M(`<i>v</i> = √(${fr('2·0.54','0.002')}) = √540 ≈ 23.2 m/s`)}`],
  check:`התשובה סבירה: מטענים של כמה מיקרו־קולון במרחק של 10 cm מפעילים כוח של כמה ניוטונים על מסה של 2 גרם.`},
 qs:[
 {l:'b',t:'num',q:`מה האנרגיה הפוטנציאלית של מערכת ${m('+4 μC')} ו־${m('−2 μC')} שנמצאים במרחק ${m('0.3 m')} זה מזה?`,a:-.24,u:'J',s:`${m(`<i>U</i> = 9·10<sup>9</sup>·${fr('(4·10<sup>−6</sup>)(−2·10<sup>−6</sup>)','0.3')} = −0.24 J`)}. הסימן השלילי הוא חלק מהתשובה.`},
 {l:'b',t:'mc',q:`האנרגיה הפוטנציאלית של מערכת שני מטענים היא ${m('−0.5 J')}. מה המשמעות?`,o:['המטענים דוחים זה את זה','צריך להשקיע 0.5 J כדי להפריד אותם למרחק אינסופי','המערכת תשחרר 0.5 J אם נפריד אותם','זה לא אפשרי, אנרגיה לא יכולה להיות שלילית'],a:1,s:`אנרגיה שלילית אומרת שהמטענים מושכים זה את זה. כדי להגיע ל־${m('<i>U</i> = 0')} (אינסוף) צריך להוסיף למערכת 0.5 J.`},
 {l:'a',t:'num',q:`בהמשך לדוגמה הפתורה: מה מהירות ${m('<i>q</i><sub>2</sub>')} כשהוא נמצא במרחק ${m('0.3 m')} מ־${m('<i>q</i><sub>1</sub>')}?`,a:18.97,u:'m/s',s:`ב־${m('0.3 m')}: ${m('<i>U</i> = 0.054/0.3 = 0.18 J')}. האנרגיה הקינטית: ${m('0.54 − 0.18 = 0.36 J')}.<br>${m('<i>v</i> = √(2·0.36/0.002) = √360 ≈ 19.0 m/s')}`},
 {l:'a',t:'num',q:`כמה עבודה צריך להשקיע כדי להביא שלושה מטענים של ${m('+1 μC')} מאינסוף לקודקודי משולש שווה צלעות שאורך צלעו ${m('0.1 m')}?`,a:.27,u:'J',s:`האנרגיה של מערכת כמה מטענים היא סכום האנרגיות של כל הזוגות. יש כאן 3 זוגות, וכולם במרחק ${m('0.1 m')}:<br>${m(`<i>U</i> = 3·9·10<sup>9</sup>·${fr('10<sup>−6</sup>·10<sup>−6</sup>','0.1')} = 3·0.09 = 0.27 J`)}`}
 ]},
{id:'potential',title:'פוטנציאל חשמלי',sub:'אנרגיה ליחידת מטען, מתח ועבודה',
 intro:[
 `<b>פוטנציאל חשמלי</b> בנקודה הוא האנרגיה הפוטנציאלית ליחידת מטען: ${m('<i>V</i> = <i>U</i><sub>E</sub>/<i>q</i>')}. היחידה היא וולט, ${m('1 V = 1 J/C')}.`,
 `הפוטנציאל סביב מטען נקודתי: ${m(`<i>V</i> = <i>k</i>${fr('<i>q</i>','<i>r</i>')}`)}, כש־${m('<i>V</i>(∞) = 0')}. הסימן של V הוא הסימן של המטען שיוצר אותו.`,
 `פוטנציאל הוא <b>סקלר</b>. הפוטנציאל של כמה מטענים הוא הסכום האלגברי (עם סימנים) של הפוטנציאלים של כל מטען, בלי פירוק לרכיבים.`,
 `<b>מתח</b> בין A ל־B: ${m('<i>V</i><sub>AB</sub> = <i>V</i><sub>A</sub> − <i>V</i><sub>B</sub>')}. העבודה של הכוח החשמלי בהעברת מטען q מ־A ל־B היא ${m('<i>W</i><sub>A→B</sub> = <i>qV</i><sub>AB</sub>')}, והיא לא תלויה במסלול.`,
 `מטען חיובי שמשחררים ממנוחה נע מפוטנציאל גבוה לנמוך. מטען שלילי נע מפוטנציאל נמוך לגבוה.`],
 formulas:[[`<i>V</i> = <i>k</i>${fr('<i>q</i>','<i>r</i>')}`,'פוטנציאל סביב מטען נקודתי'],[`<i>V</i><sub>AB</sub> = <i>V</i><sub>A</sub> − <i>V</i><sub>B</sub>`,'מתח בין A ל־B'],[`Δ<i>V</i> = <i>V</i><sub>B</sub> − <i>V</i><sub>A</sub>`,'שינוי בפוטנציאל מ־A ל־B'],[`<i>W</i><sub>A→B</sub> = <i>qV</i><sub>AB</sub>`,'עבודת הכוח החשמלי']],
 trap:[`שני סימונים שמבלבלים`,`${m('<i>V</i><sub>AB</sub>')} ו־${m('Δ<i>V</i>')} הם אותו גודל עם סימן הפוך: ${m('Δ<i>V</i> = −<i>V</i><sub>AB</sub>')}. בנוסף, ${m('<i>V</i> = 0')} בנקודה לא אומר ש־${m('<i>E</i> = 0')} שם. באמצע בין ${m('+<i>q</i>')} ל־${m('−<i>q</i>')} הפוטנציאל אפס, אבל השדה חזק.`],
 ex:{given:[`${m(q1+' = +4 μC')} בנקודה ${m('(−0.2, 0) m')}, ${m(q2+' = −2 μC')} בנקודה ${m('(0.2, 0) m')}`,`A בראשית ${m('(0, 0)')}, B בנקודה ${m('(−0.2, 0.3) m')}`],ask:[`א. מה הפוטנציאל ב־A וב־B?`,`ב. כמה עבודה עושה הכוח החשמלי כשמעבירים מטען ${m('<i>q</i> = +5 nC')} מ־A ל־B?`],
  steps:[
  `<b>פוטנציאל ב־A:</b> A במרחק ${m('0.2 m')} משני המטענים. ${M(`<i>V</i><sub>A</sub> = 9·10<sup>9</sup>(${fr('4·10<sup>−6</sup>','0.2')} + ${fr('−2·10<sup>−6</sup>','0.2')}) = 9·10<sup>4</sup> V`)}`,
  `<b>פוטנציאל ב־B:</b> B נמצא ${m('0.3 m')} מעל ${m('<i>q</i><sub>1</sub>')}. המרחק שלו מ־${m('<i>q</i><sub>2</sub>')} הוא ${m('√(0.4<sup>2</sup> + 0.3<sup>2</sup>) = 0.5 m')}. ${M(`<i>V</i><sub>B</sub> = 9·10<sup>9</sup>(${fr('4·10<sup>−6</sup>','0.3')} + ${fr('−2·10<sup>−6</sup>','0.5')}) = 1.2·10<sup>5</sup> − 3.6·10<sup>4</sup> = 8.4·10<sup>4</sup> V`)}`,
  `<b>מתח:</b> ${m('<i>V</i><sub>AB</sub> = 9·10<sup>4</sup> − 8.4·10<sup>4</sup> = 6000 V')}.`,
  `<b>עבודה:</b> ${m('<i>W</i><sub>A→B</sub> = <i>qV</i><sub>AB</sub> = 5·10<sup>−9</sup>·6000 = 3·10<sup>−5</sup> J')}. העבודה חיובית: מטען חיובי שעובר לפוטנציאל נמוך יותר.`],
  check:`פתחו את הסימולציה עם הדוגמה, וגררו את B במסלולים שונים. הערכים ב־A וב־B תלויים רק במיקום, ולכן העבודה לא תלויה במסלול.`},
 qs:[
 {l:'b',t:'num',q:`מה הפוטנציאל במרחק ${m('0.3 m')} ממטען נקודתי של ${m('−6 μC')}?`,a:-1.8e5,u:'V',s:`${m(`<i>V</i> = 9·10<sup>9</sup>·${fr('−6·10<sup>−6</sup>','0.3')} = −1.8·10<sup>5</sup> V`)}`},
 {l:'b',t:'mc',q:`מטענים ${m('+<i>q</i>')} ו־${m('−<i>q</i>')} נמצאים במרחק d זה מזה. מה נכון לגבי הנקודה שבאמצע ביניהם?`,o:['V = 0 ו־E = 0','V = 0 ו־E ≠ 0','V ≠ 0 ו־E = 0','V ≠ 0 ו־E ≠ 0'],a:1,s:`הפוטנציאלים שווים בגודלם והפוכים בסימנם, ולכן מתבטלים: ${m('<i>V</i> = 0')}. השדות של שני המטענים מצביעים לאותו כיוון (לעבר ${m('−<i>q</i>')}), ולכן הם מתחברים.`},
 {l:'b',t:'num',q:`${m('<i>V</i><sub>A</sub> = 200 V')} ו־${m('<i>V</i><sub>B</sub> = −100 V')}. מה העבודה של הכוח החשמלי כשאלקטרון עובר מ־A ל־B?`,a:-4.8e-17,u:'J',s:`${m('<i>V</i><sub>AB</sub> = 200 − (−100) = 300 V')}. ${m('<i>W</i> = <i>qV</i><sub>AB</sub> = (−1.6·10<sup>−19</sup>)(300) = −4.8·10<sup>−17</sup> J')}. העבודה שלילית: אלקטרון "לא רוצה" לעבור לפוטנציאל נמוך יותר.`},
 {l:'a',t:'num',q:`ארבעה מטענים נמצאים בקודקודי ריבוע שאורך צלעו ${m('0.2 m')}: ${m('+2 μC')}, ${m('+2 μC')}, ${m('−2 μC')} ו־${m('+2 μC')}. מה הפוטנציאל במרכז הריבוע?`,a:2.546e5,u:'V',s:`כל המטענים באותו מרחק מהמרכז: ${m('0.2/√2 = 0.1414 m')}. הפוטנציאל הוא סכום אלגברי, וסכום המטענים הוא ${m('+4 μC')}:<br>${m(`<i>V</i> = 9·10<sup>9</sup>·${fr('4·10<sup>−6</sup>','0.1414')} ≈ 2.55·10<sup>5</sup> V`)}`},
 {l:'a',t:'num',q:`אלקטרון מואץ ממנוחה דרך הפרש פוטנציאלים של ${m('500 V')}. מה מהירותו הסופית? (מסת האלקטרון ${m('9.1·10<sup>−31</sup> kg')})`,a:1.326e7,u:'m/s',s:`${m('<i>E</i><sub>k</sub> = <i>e</i>·500 = 8·10<sup>−17</sup> J')}.<br>${m(`<i>v</i> = √(${fr('2·8·10<sup>−17</sup>','9.1·10<sup>−31</sup>')}) ≈ 1.33·10<sup>7</sup> m/s`)}`},
 {l:'a',t:'mc',q:`לנקודות A ו־B אותו פוטנציאל. מעבירים מטען מ־A ל־B במסלול מעוקל וארוך. מה העבודה של הכוח החשמלי?`,o:['חיובית','שלילית','אפס','תלויה באורך המסלול'],a:2,s:`${m('<i>W</i> = <i>qV</i><sub>AB</sub>')}, ו־${m('<i>V</i><sub>AB</sub> = 0')}. בחלקים מסוימים של המסלול הכוח עושה עבודה חיובית ובאחרים שלילית, וסך הכול אפס.`}
 ]},
{id:'relation',title:'הקשר בין שדה לפוטנציאל',sub:'השדה הוא מינוס השיפוע של הפוטנציאל',
 intro:[
 `השדה החשמלי מצביע תמיד <b>בכיוון שבו הפוטנציאל יורד</b>.`,
 `בשדה אחיד: ${m(`<i>E</i> = −${fr('Δ<i>V</i>','Δ<i>x</i>')}`)}. בגרף של ${m('<i>V</i>(<i>x</i>)')}, השדה הוא מינוס השיפוע.`,
 `היחידה ${m('V/m')} שקולה ל־${m('N/C')}.`,
 `בין שני לוחות מקבילים השדה אחיד, הפוטנציאל משתנה בקו ישר, והמתח בין הלוחות הוא ${m('<i>V</i> = <i>Ed</i>')}.`,
 `כשהגרף לא ישר, השדה בנקודה הוא מינוס שיפוע המשיק. איפה שהגרף אופקי, השדה (בכיוון x) הוא אפס.`],
 formulas:[[`<i>E</i> = −${fr('Δ<i>V</i>','Δ<i>x</i>')}`,'קשר בין שדה אחיד להפרש פוטנציאלים'],[`<i>V</i> = <i>Ed</i>`,'מתח בין לוחות מקבילים (גודל)'],[`1 ${fr('V','m')} = 1 ${fr('N','C')}`,'שתי יחידות לאותו גודל']],
 trap:[`פוטנציאל גבוה, שדה חזק?`,`לא בהכרח. השדה תלוי ב<b>קצב השינוי</b> של הפוטנציאל, לא בערך שלו. באזור שבו ${m('<i>V</i> = 1000 V')} קבוע השדה הוא אפס, ובאזור שבו V משתנה מ־0 ל־10 וולט על פני מילימטר השדה הוא ${m('10<sup>4</sup> V/m')}.`],
 ex:{given:[`לוח שמאלי: ${m('1000 V')}, לוח ימני: ${m('0 V')}`,`מרחק בין הלוחות: ${m('<i>d</i> = 5 cm')}, מסת פרוטון ${m('1.67·10<sup>−27</sup> kg')}`],ask:[`א. מה השדה בין הלוחות?`,`ב. מה הפוטנציאל בנקודה P שנמצאת ${m('1 cm')} מהלוח השמאלי?`,`ג. פרוטון משתחרר ממנוחה ליד הלוח השמאלי. מה מהירותו כשהוא מגיע ללוח הימני?`],
  steps:[
  `<b>סעיף א.</b> ${M(`<i>E</i> = −${fr('0 − 1000','0.05')} = 2·10<sup>4</sup> N/C`)} השדה מצביע ימינה, מהפוטנציאל הגבוה לנמוך.`,
  `<b>סעיף ב.</b> הפוטנציאל יורד בקצב קבוע של ${m('2·10<sup>4</sup> V/m')}: ${m('<i>V</i><sub>P</sub> = 1000 − 2·10<sup>4</sup>·0.01 = 800 V')}.`,
  `<b>סעיף ג.</b> ${m('<i>W</i> = <i>qV</i><sub>AB</sub> = 1.6·10<sup>−19</sup>·1000 = 1.6·10<sup>−16</sup> J')}, וכל העבודה הופכת לאנרגיה קינטית: ${M(`<i>v</i> = √(${fr('2·1.6·10<sup>−16</sup>','1.67·10<sup>−27</sup>')}) ≈ 4.4·10<sup>5</sup> m/s`)}`],
  check:`פתחו את הסימולציה עם הדוגמה וגררו את P לנקודה ${m('1 cm')}. הפוטנציאל שמוצג הוא 800 V, וגרף V(x) הוא קו ישר שיורד.`},
 qs:[
 {l:'b',t:'mc',q:`לאורך ציר x הפוטנציאל יורד בקו ישר מ־${m('300 V')} ב־${m('<i>x</i> = 0')} ל־${m('100 V')} ב־${m('<i>x</i> = 0.1 m')}. מה השדה?`,o:['2000 N/C בכיוון +x','2000 N/C בכיוון −x','200 N/C בכיוון +x','3000 N/C בכיוון −x'],a:0,s:`${m(`<i>E</i> = −${fr('100 − 300','0.1')} = +2000 N/C`)}. הסימן החיובי אומר שהשדה בכיוון ${m('+<i>x</i>')}, לכיוון שבו הפוטנציאל יורד.`},
 {l:'b',t:'mc',q:`מטען חיובי משתחרר ממנוחה בשדה חשמלי. לאן הוא ינוע?`,o:['לפוטנציאל גבוה יותר','לפוטנציאל נמוך יותר','לאורך קו שווה פוטנציאל','תלוי במסה שלו'],a:1,s:`הכוח על מטען חיובי הוא בכיוון השדה, והשדה מצביע לכיוון שבו הפוטנציאל יורד.`},
 {l:'b',t:'mc',q:`בנקודה מסוימת ${m('<i>V</i> = 0')}. מה אפשר לומר על השדה בה?`,o:['E = 0 בהכרח','E ≠ 0 בהכרח','אי אפשר לדעת מהנתון הזה','השדה מצביע לכיוון הנקודה'],a:2,s:`השדה תלוי בשינוי של V סביב הנקודה ולא בערך שלו בנקודה עצמה. באמצע דיפול ${m('<i>V</i> = 0')} והשדה חזק, ובמקומות אחרים אפשר שגם V וגם E יהיו אפס.`},
 {l:'a',t:'num',q:`בדוגמה הפתורה (${m('<i>E</i> = 2·10<sup>4</sup> N/C')} בין שני לוחות מקבילים בעלי מטענים הפוכים), מה צפיפות המטען המשטחית ${m('<i>σ</i>')} על כל לוח? (${m('<i>ε</i><sub>0</sub> = 8.85·10<sup>−12</sup>')})`,a:1.77e-7,u:'C/m²',s:`כל לוח יוצר ${m('<i>σ</i>/2<i>ε</i><sub>0</sub>')}. בין הלוחות שני השדות באותו כיוון, ולכן ${m('<i>E</i> = <i>σ</i>/<i>ε</i><sub>0</sub>')}.<br>${m('<i>σ</i> = <i>ε</i><sub>0</sub><i>E</i> = 8.85·10<sup>−12</sup>·2·10<sup>4</sup> ≈ 1.77·10<sup>−7</sup> C/m<sup>2</sup>')}`},
 {l:'a',t:'mc',fig:'vx',q:`הגרף מתאר את הפוטנציאל לאורך ציר x (הקטעים ישרים). באיזה קטע גודל השדה הוא הגדול ביותר, ומה כיוונו?`,o:['0–2 cm, בכיוון +x','0–2 cm, בכיוון −x','2–5 cm, אין כיוון','5–8 cm, בכיוון +x'],a:3,s:`0–2 cm: ${m('<i>E</i> = −40/0.02 = −2000 V/m')}, כלומר 2000 בכיוון ${m('−<i>x</i>')}.<br>2–5 cm: V קבוע, ${m('<i>E</i> = 0')}.<br>5–8 cm: ${m('<i>E</i> = −(−50 − 40)/0.03 = +3000 V/m')}, כלומר 3000 בכיוון ${m('+<i>x</i>')}. זה הגדול ביותר.`},
 {l:'a',t:'num',q:`אלקטרון משתחרר ממנוחה ליד הלוח השלילי בדוגמה הפתורה (${m('1000 V')} בין הלוחות). מה מהירותו כשהוא מגיע ללוח החיובי?`,a:1.875e7,u:'m/s',s:`האלקטרון עובר מפוטנציאל 0 ל־1000 V, והכוח החשמלי עושה עליו עבודה ${m('<i>W</i> = (−<i>e</i>)(0 − 1000) = 1.6·10<sup>−16</sup> J')}.<br>${m(`<i>v</i> = √(${fr('2·1.6·10<sup>−16</sup>','9.1·10<sup>−31</sup>')}) ≈ 1.9·10<sup>7</sup> m/s`)}. אותה אנרגיה כמו לפרוטון, אבל המסה קטנה פי 1800 בערך.`}
 ]},
{id:'plates',title:'לוחות טעונים',sub:'לוח אחד, שני לוחות, ושדה אחיד',
 intro:[
 `לוח שגודלו גדול מאוד ביחס למרחקים שמעניינים אותנו נחשב <b>לוח אינסופי</b>. אם המטען ${m('<i>Q</i>')} מפוזר באופן אחיד על שטח ${m('<i>A</i>')}, צפיפות המטען המשטחית היא ${m(`<i>σ</i> = ${fr('<i>Q</i>','<i>A</i>')}`)}.`,
 `<b>לוח אחד</b> יוצר שדה אחיד שגודלו ${m(`<i>E</i> = 2π<i>kσ</i> = ${fr('<i>σ</i>','2<i>ε</i><sub>0</sub>')}`)}. השדה ניצב ללוח, שווה בגודלו משני הצדדים, ולא תלוי במרחק מהלוח. הוא מתרחק מלוח חיובי ומצביע אל לוח שלילי.`,
 `<b>שני לוחות מקבילים</b>: השדה בכל נקודה הוא סכום וקטורי של השדות של שני הלוחות (סופרפוזיציה).`,
 `לוחות עם מטענים שווים והפוכים (${m('+<i>σ</i>')} ו־${m('−<i>σ</i>')}): בין הלוחות שני השדות באותו כיוון, ${m(`<i>E</i> = ${fr('<i>σ</i>','<i>ε</i><sub>0</sub>')} = 4π<i>kσ</i>`)}, מהלוח החיובי לשלילי. מחוץ ללוחות השדות מבטלים זה את זה, ${m('<i>E</i> = 0')}. זה המבנה של קבל.`,
 `לוחות עם מטענים זהים (${m('+<i>σ</i>')} ו־${m('+<i>σ</i>')}): בין הלוחות השדות מתבטלים, ומחוץ ללוחות ${m('<i>E</i> = <i>σ</i>/<i>ε</i><sub>0</sub>')} כלפי חוץ.`,
 `בין הלוחות השדה אחיד, ולכן הפוטנציאל יורד בקו ישר בכיוון השדה, והמתח בין הלוחות הוא ${m('<i>V</i> = <i>Ed</i>')}.`],
 formulas:[[`<i>E</i> = 2π<i>kσ</i> = ${fr('<i>σ</i>','2<i>ε</i><sub>0</sub>')}`,'השדה של לוח אחד'],[`<i>σ</i> = ${fr('<i>Q</i>','<i>A</i>')}`,'צפיפות מטען משטחית'],[`<i>E</i> = ${fr('<i>σ</i>','<i>ε</i><sub>0</sub>')} = 4π<i>kσ</i>`,`בין לוחות ${m('+<i>σ</i>')} ו־${m('−<i>σ</i>')} (סכום שני הלוחות)`],[`<i>V</i> = <i>Ed</i>`,'המתח בין הלוחות']],
 trap:[`"השדה בין הלוחות הוא השדה של הלוח החיובי"`,`טעות נפוצה היא להציב ${m('<i>σ</i>/2<i>ε</i><sub>0</sub>')} בין לוחות של קבל. כל לוח תורם ${m('<i>σ</i>/2<i>ε</i><sub>0</sub>')}, ובין הלוחות שתי התרומות באותו כיוון, ולכן ${m('<i>E</i> = <i>σ</i>/<i>ε</i><sub>0</sub>')}. מחוץ ללוחות אותן תרומות מנוגדות ומתבטלות.`],
 ex:{given:[`שני לוחות מקבילים, שטח כל לוח ${m('<i>A</i> = 0.01 m<sup>2</sup>')}`,`מטענים ${m('+5 nC')} ו־${m('−5 nC')}, מרחק ${m('<i>d</i> = 2 cm')}`],ask:[`א. מה צפיפות המטען על כל לוח?`,`ב. מה השדה שיוצר כל לוח לבדו?`,`ג. מה השדה בין הלוחות ומחוץ להם?`,`ד. מה המתח בין הלוחות?`],
  steps:[
  `<b>סעיף א.</b> ${m(`<i>σ</i> = ${fr('5·10<sup>−9</sup>','0.01')} = 5·10<sup>−7</sup> C/m<sup>2</sup>`)}.`,
  `<b>סעיף ב.</b> ${M(`<i>E</i><sub>1</sub> = 2π<i>kσ</i> = 2π·9·10<sup>9</sup>·5·10<sup>−7</sup> ≈ 2.83·10<sup>4</sup> N/C`)} זה גודל השדה של כל אחד מהלוחות, משני צידיו.`,
  `<b>סעיף ג.</b> בין הלוחות שני השדות מצביעים מהלוח החיובי לשלילי, ולכן ${m('<i>E</i> = 2·2.83·10<sup>4</sup> ≈ 5.65·10<sup>4</sup> N/C')}. מחוץ ללוחות השדות מנוגדים ושווים, ולכן ${m('<i>E</i> = 0')}.`,
  `<b>סעיף ד.</b> ${m('<i>V</i> = <i>Ed</i> = 5.65·10<sup>4</sup>·0.02 ≈ 1.13·10<sup>3</sup> V')}.`],
  check:`אותה תוצאה מתקבלת מ־${m('<i>E</i> = <i>σ</i>/<i>ε</i><sub>0</sub> = 5·10<sup>−7</sup>/8.85·10<sup>−12</sup> ≈ 5.65·10<sup>4</sup> N/C')}. בסימולציה עם הדוגמה, גררו את P בין הלוחות ומחוצה להם.`},
 qs:[
 {l:'b',t:'mc',q:`לוח גדול טעון במטען אחיד. נקודה A נמצאת ${m('1 cm')} מהלוח, ונקודה B נמצאת ${m('10 cm')} ממנו (באותו צד). מה נכון?`,o:['E_A = 10 E_B','E_A = 100 E_B','E_A = E_B','E_B > E_A'],a:2,s:`השדה של לוח אינסופי, ${m('2π<i>kσ</i>')}, לא תלוי במרחק מהלוח.`},
 {l:'b',t:'num',q:`לוח גדול טעון בצפיפות מטען ${m('2 μC/m<sup>2</sup>')}. מה גודל השדה לידו?`,a:1.131e5,u:'N/C',s:`${m('<i>E</i> = 2π<i>kσ</i> = 2π·9·10<sup>9</sup>·2·10<sup>−6</sup> ≈ 1.13·10<sup>5</sup> N/C')}`},
 {l:'b',t:'mc',q:`שני לוחות מקבילים טעונים ב־${m('+<i>σ</i>')} וב־${m('−<i>σ</i>')}. מה השדה מחוץ ללוחות?`,o:['σ/2ε₀','σ/ε₀','אפס','תלוי במרחק מהלוחות'],a:2,s:`מחוץ ללוחות השדה של הלוח החיובי מתרחק ממנו, והשדה של הלוח השלילי מצביע אליו. שני השדות שווים בגודלם ומנוגדים, ולכן מתבטלים.`},
 {l:'b',t:'mc',q:`שני לוחות מקבילים טעונים שניהם ב־${m('+<i>σ</i>')}. מה השדה בין הלוחות?`,o:['σ/ε₀ מלוח ללוח','σ/2ε₀','אפס','2σ/ε₀'],a:2,s:`בין הלוחות כל לוח "דוחף" את השדה הרחק ממנו, כלומר לכיוונים הפוכים, בגדלים שווים. מחוץ ללוחות השדות מתחברים ל־${m('<i>σ</i>/<i>ε</i><sub>0</sub>')} כלפי חוץ.`},
 {l:'a',t:'num',q:`בין שני לוחות מקבילים, טעונים ב־${m('+<i>σ</i>')} וב־${m('−<i>σ</i>')}, המתח ${m('2000 V')} והמרחק ${m('4 cm')}. מה ${m('<i>σ</i>')}? (${m('<i>ε</i><sub>0</sub> = 8.85·10<sup>−12</sup>')})`,a:4.425e-7,u:'C/m²',s:`${m('<i>E</i> = <i>V</i>/<i>d</i> = 2000/0.04 = 5·10<sup>4</sup> N/C')}. בין הלוחות ${m('<i>E</i> = <i>σ</i>/<i>ε</i><sub>0</sub>')}, ולכן ${m('<i>σ</i> = 8.85·10<sup>−12</sup>·5·10<sup>4</sup> ≈ 4.43·10<sup>−7</sup> C/m<sup>2</sup>')}.`},
 {l:'a',t:'num',q:`אלקטרון נכנס באמצע בין שני לוחות אופקיים במהירות אופקית ${m('2·10<sup>7</sup> m/s')}. השדה בין הלוחות אחיד, ${m('2·10<sup>4</sup> N/C')}, ואורך הלוחות ${m('5 cm')}. בכמה מתרחק האלקטרון מהקו האמצעי עד שהוא יוצא מהלוחות? (תשובה ב־cm, ${m('<i>m</i><sub>e</sub> = 9.1·10<sup>−31</sup> kg')}, הזניחו כובד)`,a:1.099,u:'cm',s:`זו "בליסטיקה" בשדה חשמלי. תאוצה אנכית: ${m(`<i>a</i> = ${fr('<i>eE</i>','<i>m</i>')} = ${fr('1.6·10<sup>−19</sup>·2·10<sup>4</sup>','9.1·10<sup>−31</sup>')} ≈ 3.52·10<sup>15</sup> m/s<sup>2</sup>`)}.<br>זמן המעבר: ${m('<i>t</i> = 0.05/2·10<sup>7</sup> = 2.5·10<sup>−9</sup> s')}.<br>${m(`<i>y</i> = ${fr('1','2')}<i>at</i><sup>2</sup> = 0.5·3.52·10<sup>15</sup>·(2.5·10<sup>−9</sup>)<sup>2</sup> ≈ 0.011 m = 1.1 cm`)}.`},
 {l:'a',t:'num',q:`שני לוחות מקבילים: השמאלי טעון ב־${m('+3 μC/m<sup>2</sup>')} והימני ב־${m('+1 μC/m<sup>2</sup>')}. מה גודל השדה בין הלוחות?`,a:1.13e5,u:'N/C',s:`בין הלוחות השדה של הלוח השמאלי מצביע ימינה, ${m('3·10<sup>−6</sup>/2<i>ε</i><sub>0</sub>')}, והשדה של הלוח הימני מצביע שמאלה, ${m('1·10<sup>−6</sup>/2<i>ε</i><sub>0</sub>')}.<br>${m(`<i>E</i> = ${fr('(3 − 1)·10<sup>−6</sup>','2·8.85·10<sup>−12</sup>')} ≈ 1.13·10<sup>5</sup> N/C`)}, ימינה. אפשר לבדוק בסימולציה עם הכפתור "‎+3 ו־‎+1".`}
 ]},
{id:'sphere',title:'כדור וקליפה טעונים',sub:'בפנים השדה אפס, בחוץ כמו מטען נקודתי',
 intro:[
 `במוליך בשיווי משקל המטענים החופשיים נעים עד שהשדה בתוך החומר מתאפס. לכן כל המטען העודף יושב על <b>פני השטח</b>, ובכדור מוליך הוא מתפזר שם באופן אחיד. כדור מוליך מלא וקליפה כדורית דקה מתנהגים אותו דבר.`,
 `<b>מחוץ לכדור</b> (${m('<i>r</i> ≥ <i>R</i>')}) השדה והפוטנציאל הם כאילו כל המטען מרוכז במרכז: ${m(`<i>E</i> = <i>k</i>${fr('<i>Q</i>','<i>r</i><sup>2</sup>')}`)}, ${m(`<i>V</i> = <i>k</i>${fr('<i>Q</i>','<i>r</i>')}`)}.`,
 `<b>בתוך הכדור</b> (${m('<i>r</i> &lt; <i>R</i>')}) השדה הוא אפס. כשהשדה אפס הפוטנציאל לא משתנה, ולכן בכל נקודה בפנים ${m(`<i>V</i> = <i>k</i>${fr('<i>Q</i>','<i>R</i>')}`)}, בדיוק כמו על פני הכדור.`,
 `על פני הכדור השדה "קופץ" מאפס ל־${m(`<i>k</i>${fr('<i>Q</i>','<i>R</i><sup>2</sup>')}`)}, אבל הפוטנציאל רציף ולא קופץ.`,
 `הכדור כולו, פנים ופני שטח, הוא גוף שווה פוטנציאל. העבודה בהעברת מטען בתוכו היא אפס.`],
 formulas:[[`<i>E</i> = <i>k</i>${fr('<i>Q</i>','<i>r</i><sup>2</sup>')} , <i>V</i> = <i>k</i>${fr('<i>Q</i>','<i>r</i>')}`,`מחוץ לכדור, ${m('<i>r</i> ≥ <i>R</i>')}`],[`<i>E</i> = 0 , <i>V</i> = <i>k</i>${fr('<i>Q</i>','<i>R</i>')}`,`בתוך הכדור, ${m('<i>r</i> &lt; <i>R</i>')}`],[`<i>E</i> = <i>k</i>${fr('<i>Q</i>','<i>R</i><sup>2</sup>')}`,'השדה ממש מחוץ לפני הכדור']],
 trap:[`"בפנים השדה אפס, אז גם הפוטנציאל אפס"`,`זו הטעות הנפוצה ביותר בנושא. השדה הוא קצב השינוי של הפוטנציאל. אפס שדה אומר שהפוטנציאל <b>קבוע</b>, לא שהוא אפס. בתוך כדור טעון ב־${m('+<i>Q</i>')} הפוטנציאל הוא ${m('<i>kQ</i>/<i>R</i>')} בכל נקודה, כולל במרכז.`],
 ex:{given:[`כדור מוליך שרדיוסו ${m('<i>R</i> = 0.1 m')} וטעון ב־${m('<i>Q</i> = +2 μC')}`,`מטען בוחן ${m('<i>q</i> = +1 nC')}`],ask:[`א. מה E ו־V ב־${m('<i>r</i> = 0.05 m')}?`,`ב. מה E ו־V ממש מחוץ לפני הכדור?`,`ג. מה E ו־V ב־${m('<i>r</i> = 0.3 m')}?`,`ד. כמה עבודה צריך להשקיע כדי להביא את q מ־${m('<i>r</i> = 0.3 m')} למרכז הכדור?`],
  steps:[
  `<b>סעיף א.</b> הנקודה בתוך הכדור: ${m('<i>E</i> = 0')}, ו־${m(`<i>V</i> = <i>k</i>${fr('<i>Q</i>','<i>R</i>')} = ${fr('9·10<sup>9</sup>·2·10<sup>−6</sup>','0.1')} = 1.8·10<sup>5</sup> V`)}.`,
  `<b>סעיף ב.</b> ${m(`<i>E</i> = ${fr('9·10<sup>9</sup>·2·10<sup>−6</sup>','0.1<sup>2</sup>')} = 1.8·10<sup>6</sup> N/C`)}, ו־${m('<i>V</i> = 1.8·10<sup>5</sup> V')}, כמו בפנים.`,
  `<b>סעיף ג.</b> ${m(`<i>E</i> = ${fr('1.8·10<sup>4</sup>','0.3<sup>2</sup>')} = 2·10<sup>5</sup> N/C`)}, ${m(`<i>V</i> = ${fr('1.8·10<sup>4</sup>','0.3')} = 6·10<sup>4</sup> V`)}.`,
  `<b>סעיף ד.</b> העבודה החיצונית שווה לשינוי באנרגיה הפוטנציאלית: ${M(`<i>W</i><sub>חיצוני</sub> = <i>q</i>(<i>V</i><sub>מרכז</sub> − <i>V</i><sub>0.3</sub>) = 10<sup>−9</sup>(1.8·10<sup>5</sup> − 6·10<sup>4</sup>) = 1.2·10<sup>−4</sup> J`)} כל העבודה מושקעת בדרך עד פני הכדור. בתוך הכדור אין שדה, ולכן אין צורך בעבודה נוספת.`],
  check:`בסימולציה עם הדוגמה, גררו את P מבחוץ פנימה: בגרף השדה קופץ לאפס על פני הכדור, וגרף הפוטנציאל נעשה אופקי.`},
 qs:[
 {l:'b',t:'mc',q:`כדור מוליך טעון במטען ${m('+<i>Q</i>')} ונמצא בשיווי משקל. מה נכון לגבי נקודה בתוכו?`,o:['E = 0 ו־V = 0','E = 0 ו־V = kQ/R','E = kQ/r² ו־V = kQ/r','E = kQ/R² ו־V = 0'],a:1,s:`בתוך מוליך בשיווי משקל ${m('<i>E</i> = 0')}, ולכן הפוטנציאל קבוע ושווה לפוטנציאל על פני הכדור.`},
 {l:'b',t:'num',q:`קליפה כדורית דקה שרדיוסה ${m('0.2 m')} טעונה ב־${m('+4 μC')}. מה הפוטנציאל במרכזה?`,a:1.8e5,u:'V',s:`במרכז, כמו בכל נקודה בפנים: ${m(`<i>V</i> = ${fr('9·10<sup>9</sup>·4·10<sup>−6</sup>','0.2')} = 1.8·10<sup>5</sup> V`)}.`},
 {l:'b',t:'num',q:`אותה קליפה (${m('<i>R</i> = 0.2 m')}, ${m('+4 μC')}). מה גודל השדה במרחק ${m('0.4 m')} מהמרכז?`,a:2.25e5,u:'N/C',s:`מחוץ לקליפה היא מתנהגת כמו מטען נקודתי: ${m(`<i>E</i> = ${fr('9·10<sup>9</sup>·4·10<sup>−6</sup>','0.4<sup>2</sup>')} = 2.25·10<sup>5</sup> N/C`)}.`},
 {l:'b',t:'mc',q:`כדור מוליך טעון ב־${m('<i>Q</i>')}, ומטען נקודתי זהה ${m('<i>Q</i>')} נמצא במרכז של כדור דמיוני. מה נכון לגבי השדה ${m('0.5 m')} מהמרכז, מחוץ לכדור?`,o:['השדה של הכדור המוליך קטן יותר','השדות שווים','השדה של הכדור המוליך גדול יותר','תלוי ברדיוס הכדור המוליך'],a:1,s:`מחוץ לכדור טעון, השדה זהה לשדה של מטען נקודתי באותו גודל במרכז, ולא תלוי ברדיוס.`},
 {l:'a',t:'num',q:`הפוטנציאל של כדור מוליך שרדיוסו ${m('15 cm')} הוא ${m('3000 V')}. מה המטען שלו? (תשובה ב־nC)`,a:50,u:'nC',s:`${m(`<i>Q</i> = ${fr('<i>VR</i>','<i>k</i>')} = ${fr('3000·0.15','9·10<sup>9</sup>')} = 5·10<sup>−8</sup> C = 50 nC`)}`},
 {l:'a',t:'mc',q:`איזה תיאור מתאים לגרף של גודל השדה ${m('<i>E</i>(<i>r</i>)')} של כדור מוליך טעון?`,o:['עולה בקו ישר מהמרכז עד R, ואז יורד כמו 1/r²','אפס עד R, קפיצה ל־kQ/R², ואז יורד כמו 1/r²','קבוע ושווה kQ/R² עד R, ואז יורד כמו 1/r','יורד כמו 1/r² בכל מקום'],a:1,s:`בפנים השדה אפס. ממש מחוץ לפני הכדור ${m('<i>kQ</i>/<i>R</i><sup>2</sup>')}, ומשם הוא יורד כמו ${m('1/<i>r</i><sup>2</sup>')}. (גרף שעולה בקו ישר עד R מתאים לכדור <b>מבודד</b> שהמטען מפוזר בכל נפחו, שאינו בתוכנית.)`},
 {l:'a',t:'num',q:`שתי קליפות כדוריות בעלות מרכז משותף: הפנימית, ברדיוס ${m('0.1 m')}, טעונה ב־${m('+2 μC')}, והחיצונית, ברדיוס ${m('0.3 m')}, טעונה ב־${m('−1 μC')}. מה הפוטנציאל במרכז?`,a:1.5e5,u:'V',s:`פוטנציאלים מתחברים כסקלרים. המרכז נמצא בתוך שתי הקליפות, ולכן כל אחת תורמת ${m('<i>kQ</i>/<i>R</i>')} שלה:<br>${m(`<i>V</i> = ${fr('9·10<sup>9</sup>·2·10<sup>−6</sup>','0.1')} + ${fr('9·10<sup>9</sup>·(−10<sup>−6</sup>)','0.3')} = 1.8·10<sup>5</sup> − 3·10<sup>4</sup> = 1.5·10<sup>5</sup> V`)}`},
 {l:'a',t:'num',q:`פרוטון משתחרר ממנוחה ליד פני הכדור מהדוגמה הפתורה (${m('<i>V</i> = 1.8·10<sup>5</sup> V')}). מה תהיה מהירותו רחוק מאוד מהכדור? (${m('<i>m</i><sub>p</sub> = 1.67·10<sup>−27</sup> kg')})`,a:5.873e6,u:'m/s',s:`${m('<i>E</i><sub>k</sub> = <i>e</i>(<i>V</i><sub>R</sub> − 0) = 1.6·10<sup>−19</sup>·1.8·10<sup>5</sup> = 2.88·10<sup>−14</sup> J')}.<br>${m(`<i>v</i> = √(${fr('2·2.88·10<sup>−14</sup>','1.67·10<sup>−27</sup>')}) ≈ 5.9·10<sup>6</sup> m/s`)}`}
 ]},
{id:'connect',title:'חיבור מוליכים',sub:'מטען זורם עד שהפוטנציאלים משתווים',
 intro:[
 `כשמחברים שני מוליכים בתיל מוליך, הם הופכים למוליך אחד. במוליך בשיווי משקל הפוטנציאל זהה בכל נקודה, ולכן <b>מטען עובר בתיל עד שהפוטנציאלים משתווים</b>.`,
 `בפועל נעים האלקטרונים, מהפוטנציאל הנמוך לגבוה. בחשבון זה שקול למעבר מטען חיובי מהפוטנציאל הגבוה לנמוך.`,
 `המטען הכולל נשמר: מה שכדור אחד מאבד, הכדור השני מקבל.`,
 `לשני כדורים רחוקים זה מזה, שוויון הפוטנציאלים נותן ${m(`${fr(`<i>kQ</i><sub>1</sub>'`,'<i>R</i><sub>1</sub>')} = ${fr(`<i>kQ</i><sub>2</sub>'`,'<i>R</i><sub>2</sub>')}`)}, כלומר ${m(`${fr(`<i>Q</i><sub>1</sub>'`,`<i>Q</i><sub>2</sub>'`)} = ${fr('<i>R</i><sub>1</sub>','<i>R</i><sub>2</sub>')}`)}. הכדור הגדול מקבל יותר מטען. כשהכדורים זהים, המטען מתחלק שווה בשווה.`,
 `השדה על פני כדור הוא ${m(`<i>E</i> = <i>k</i>${fr('<i>Q</i>','<i>R</i><sup>2</sup>')} = ${fr('<i>V</i>','<i>R</i>')}`)}. אחרי החיבור הפוטנציאל משותף, ולכן על הכדור הקטן השדה חזק יותר. זה ההסבר לכך שהשדה חזק במיוחד ליד חודים של מוליך, ולפעולה של כליא ברק.`,
 `<b>הארקה</b>: כדור הארץ הוא מוליך ענק שהפוטנציאל שלו נחשב אפס. כשמחברים אליו כדור מוליך מבודד, המטען עובר עד שגם הכדור מגיע לפוטנציאל אפס, כלומר הכדור מאבד את כל המטען שלו.`],
 formulas:[[`<i>V</i><sub>1</sub>' = <i>V</i><sub>2</sub>'`,'תנאי הסיום: פוטנציאלים שווים'],[`<i>Q</i><sub>1</sub>' + <i>Q</i><sub>2</sub>' = <i>Q</i><sub>1</sub> + <i>Q</i><sub>2</sub>`,'שימור מטען'],[`${fr(`<i>Q</i><sub>1</sub>'`,`<i>Q</i><sub>2</sub>'`)} = ${fr('<i>R</i><sub>1</sub>','<i>R</i><sub>2</sub>')}`,'שני כדורים רחוקים זה מזה'],[`<i>E</i> = ${fr('<i>V</i>','<i>R</i>')}`,'השדה על פני כדור']],
 trap:[`"המטען זורם עד שהמטענים שווים"`,`לא. מה שמשתווה הוא <b>הפוטנציאל</b>, לא המטען. המטענים יוצאים שווים רק כשהכדורים זהים. כדור ברדיוס כפול יקבל מטען כפול. ועוד טעות: מטען יכול לעבור גם מכדור עם פחות מטען לכדור עם יותר מטען, אם הפוטנציאל שלו גבוה יותר.`],
 ex:{given:[`כדור 1: ${m('<i>R</i><sub>1</sub> = 0.1 m')}, ${m('<i>Q</i><sub>1</sub> = +6 μC')}`,`כדור 2: ${m('<i>R</i><sub>2</sub> = 0.2 m')}, לא טעון. הכדורים רחוקים זה מזה ומחברים אותם בתיל דק.`],ask:[`א. מה המטען על כל כדור אחרי החיבור?`,`ב. מה הפוטנציאל המשותף?`,`ג. כמה מטען עבר בתיל, ולאיזה כיוון נעו האלקטרונים?`,`ד. מה השדה על פני כל כדור?`],
  steps:[
  `<b>לפני החיבור:</b> ${m(`<i>V</i><sub>1</sub> = ${fr('9·10<sup>9</sup>·6·10<sup>−6</sup>','0.1')} = 5.4·10<sup>5</sup> V`)}, ${m('<i>V</i><sub>2</sub> = 0')}. הפוטנציאלים שונים, ולכן מטען יעבור.`,
  `<b>סעיף א.</b> שימור מטען: ${m(`<i>Q</i><sub>1</sub>' + <i>Q</i><sub>2</sub>' = 6 μC`)}. שוויון פוטנציאלים: ${m(`<i>Q</i><sub>1</sub>'/<i>Q</i><sub>2</sub>' = 0.1/0.2 = 1/2`)}. לכן ${m(`<i>Q</i><sub>1</sub>' = 2 μC`)} ו־${m(`<i>Q</i><sub>2</sub>' = 4 μC`)}.`,
  `<b>סעיף ב.</b> ${m(`<i>V</i> = ${fr('9·10<sup>9</sup>·2·10<sup>−6</sup>','0.1')} = 1.8·10<sup>5</sup> V`)}.`,
  `<b>סעיף ג.</b> עברו ${m('4 μC')}: כדור 1 ירד מ־6 ל־2. בחשבון, מטען חיובי עבר מכדור 1 (פוטנציאל גבוה) לכדור 2. בפועל ${m('4·10<sup>−6</sup>/1.6·10<sup>−19</sup> = 2.5·10<sup>13</sup>')} אלקטרונים עברו מכדור 2 לכדור 1.`,
  `<b>סעיף ד.</b> ${m('<i>E</i><sub>1</sub> = <i>V</i>/<i>R</i><sub>1</sub> = 1.8·10<sup>6</sup> N/C')}, ${m('<i>E</i><sub>2</sub> = <i>V</i>/<i>R</i><sub>2</sub> = 9·10<sup>5</sup> N/C')}. לכדור הקטן פחות מטען, אבל שדה חזק פי 2 על פניו.`],
  check:`${m(`<i>V</i><sub>2</sub>' = 9·10<sup>9</sup>·4·10<sup>−6</sup>/0.2 = 1.8·10<sup>5</sup> V`)}, שווה ל־${m(`<i>V</i><sub>1</sub>'`)}. בסימולציה, טענו את הדוגמה ולחצו "חיבור הכדורים בתיל".`},
 qs:[
 {l:'b',t:'mc',q:`מחברים בתיל שני כדורים מוליכים טעונים. מתי מפסיק לעבור מטען בתיל?`,o:['כשהמטענים על הכדורים שווים','כשהפוטנציאלים של הכדורים שווים','כשאחד הכדורים מתרוקן ממטען','כשהשדות על פני הכדורים שווים'],a:1,s:`מטען עובר כל עוד יש מתח בין קצות התיל. בשיווי משקל כל המוליך, כולל התיל, נמצא באותו פוטנציאל.`},
 {l:'b',t:'num',q:`שני כדורים מוליכים זהים טעונים ב־${m('+8 μC')} וב־${m('−2 μC')}. מחברים אותם בתיל. מה המטען על כל כדור אחרי החיבור? (תשובה ב־μC)`,a:3,u:'μC',s:`המטען הכולל ${m('+6 μC')}. הכדורים זהים, ולכן פוטנציאלים שווים פירושם מטענים שווים: ${m('+3 μC')} לכל כדור.`},
 {l:'b',t:'mc',q:`כדור שרדיוסו R וכדור שרדיוסו 3R, רחוקים זה מזה, מחוברים בתיל. מה היחס בין המטען על הכדור הקטן למטען על הגדול?`,o:['1:1','1:3','3:1','1:9'],a:1,s:`${m(`<i>Q</i><sub>1</sub>'/<i>Q</i><sub>2</sub>' = <i>R</i><sub>1</sub>/<i>R</i><sub>2</sub> = 1/3`)}.`},
 {l:'b',t:'mc',q:`אחרי החיבור של אותם שני כדורים (R ו־3R), על פני איזה כדור השדה חזק יותר?`,o:['על הכדור הקטן','על הכדור הגדול','השדות שווים','אין שדה כי הפוטנציאלים שווים'],a:0,s:`${m('<i>E</i> = <i>V</i>/<i>R</i>')} והפוטנציאל משותף, ולכן על הכדור הקטן השדה חזק פי 3.`},
 {l:'a',t:'num',q:`כדור 1: ${m('<i>R</i> = 5 cm')}, ${m('+3 μC')}. כדור 2: ${m('<i>R</i> = 10 cm')}, ${m('−6 μC')}. הכדורים רחוקים זה מזה ומחברים אותם בתיל. מה הפוטנציאל המשותף?`,a:-1.8e5,u:'V',s:`המטען הכולל ${m('−3 μC')}, והיחס ${m(`<i>Q</i><sub>1</sub>'/<i>Q</i><sub>2</sub>' = 5/10`)}. לכן ${m(`<i>Q</i><sub>1</sub>' = −1 μC`)}, ${m(`<i>Q</i><sub>2</sub>' = −2 μC`)}.<br>${m(`<i>V</i> = ${fr('9·10<sup>9</sup>·(−10<sup>−6</sup>)','0.05')} = −1.8·10<sup>5</sup> V`)}`},
 {l:'a',t:'num',q:`בהמשך לשאלה הקודמת: כמה אלקטרונים עברו בתיל?`,a:2.5e13,u:'אלקטרונים',s:`המטען של כדור 1 השתנה מ־${m('+3 μC')} ל־${m('−1 μC')}, שינוי של ${m('4 μC')}. ${m('<i>n</i> = 4·10<sup>−6</sup>/1.6·10<sup>−19</sup> = 2.5·10<sup>13</sup>')}. האלקטרונים עברו מכדור 2 (פוטנציאל התחלתי ${m('−5.4·10<sup>5</sup> V')}) לכדור 1 (${m('+5.4·10<sup>5</sup> V')}).`},
 {l:'a',t:'mc',q:`כדור מוליך מבודד טעון ב־${m('+<i>Q</i>')}. מחברים אותו בתיל לאדמה. מה יקרה?`,o:['חצי מהמטען יעבור לאדמה','כמעט כל המטען יעבור לאדמה','המטען יישאר, כי האדמה לא טעונה','אלקטרונים יעברו מהכדור לאדמה'],a:1,s:`אפשר לחשוב על כדור הארץ ככדור ענק: ${m(`<i>Q</i>'/<i>Q</i>'<sub>ארץ</sub> = <i>R</i>/<i>R</i><sub>ארץ</sub> ≈ 0`)}. הכדור מגיע לפוטנציאל אפס, ולכן נשאר בלי מטען. בפועל אלקטרונים עולים מהאדמה אל הכדור ומנטרלים אותו.`}
 ]},
{id:'lines',title:'קווי שדה חשמלי',sub:'איך מציירים שדה, ומה אפשר לקרוא מהציור',
 intro:[
 `<b>קווי שדה</b> הם דרך לצייר את השדה. בכל נקודה הקו משיק לכיוון השדה, והחץ מראה את כיוון הכוח על מטען חיובי.`,
 `הקווים יוצאים ממטענים חיוביים ונכנסים למטענים שליליים, או ממשיכים לאינסוף.`,
 `מספר הקווים שיוצאים ממטען או נכנסים אליו יחסי לגודל המטען. במקום שבו הקווים צפופים השדה חזק.`,
 `קווי שדה לא נחתכים: אילו נחתכו, היו לשדה שני כיוונים באותה נקודה.`,
 `בין לוחות מקבילים הקווים ישרים, מקבילים ובמרווחים שווים. כך נראה שדה אחיד.`],
 formulas:[],
 trap:[`קו שדה הוא לא מסלול`,`מטען שמשוחרר ממנוחה <b>לא</b> נע בדרך כלל לאורך קו השדה. התאוצה שלו משיקה לקו, אבל ברגע שיש לו מהירות, המסלול מתעקם פחות מהקו. רק לאורך קו שדה ישר המסלול והקו מתלכדים.`],
 ex:{given:[`מטען ${m('+2<i>q</i>')} ומטען ${m('−<i>q</i>')}`,`מכל ${m('<i>q</i>')} יוצאים 4 קווים בציור`],ask:[`א. כמה קווים יוצאים מ־${m('+2<i>q</i>')} וכמה נכנסים ל־${m('−<i>q</i>')}?`,`ב. מה קורה לשאר הקווים?`,`ג. איפה בקירוב השדה מתאפס?`],
  steps:[
  `<b>סעיף א.</b> מ־${m('+2<i>q</i>')} יוצאים 8 קווים, ול־${m('−<i>q</i>')} נכנסים 4.`,
  `<b>סעיף ב.</b> 4 הקווים הנותרים לא מוצאים מטען שלילי, ולכן ממשיכים לאינסוף. ממרחק גדול המערכת נראית כמו מטען נקודתי של ${m('+<i>q</i>')} (סכום המטענים).`,
  `<b>סעיף ג.</b> לפי השיקול מהנושא "שדה חשמלי": הסימנים הפוכים, ולכן הנקודה מחוץ לקטע ומאחורי המטען הקטן. בציור רואים שם אזור ריק מקווים, ושני קווים שנפרדים לכיוונים הפוכים.`],
  check:`טענו בסימולציה את "‎+2q ו־‎−q" וספרו את הקווים. הוסיפו את הקווים שווי הפוטנציאל כדי לראות את נקודת האפס.`},
 qs:[
 {l:'b',t:'mc',q:`למה קווי שדה חשמלי לא יכולים להיחתך?`,o:['כי הם דוחים זה את זה','כי בנקודת החיתוך היו לשדה שני כיוונים','כי מספר הקווים מוגבל','הם יכולים להיחתך בין שני מטענים'],a:1,s:`הקו משיק לכיוון השדה, ובכל נקודה יש לשדה כיוון אחד בלבד.`},
 {l:'b',t:'mc',q:`בציור קווי שדה, הקווים בסביבת נקודה A צפופים פי 2 מאשר בסביבת נקודה B. מה נכון?`,o:['E_A > E_B','E_A < E_B','E_A = E_B','V_A > V_B בהכרח'],a:0,s:`צפיפות הקווים מייצגת את עוצמת השדה. על הפוטנציאל אי אפשר להסיק רק מהצפיפות.`},
 {l:'b',t:'mc',q:`בציור, 8 קווים יוצאים ממטען ${m('+<i>q</i>')}. כמה קווים צריכים להיכנס למטען ${m('−2<i>q</i>')} באותו ציור?`,o:['4','8','16','תלוי במרחק'],a:2,s:`מספר הקווים יחסי לגודל המטען: פי 2 מטען, פי 2 קווים.`},
 {l:'a',t:'mc',q:`מטען חיובי קטן משתחרר ממנוחה על קו שדה מעוקל. מה נכון לגבי המסלול שלו?`,o:['נע בדיוק לאורך קו השדה','בהתחלה נע בכיוון המשיק לקו, ואחר כך סוטה ממנו','נע ניצב לקו השדה','נע לאורך קו שווה פוטנציאל'],a:1,s:`ברגע השחרור התאוצה, ולכן גם תחילת התנועה, משיקה לקו. אחר כך למטען יש מהירות, והתאוצה משנה את כיוונה בהדרגה בלבד, כך שהמסלול סוטה מהקו המעוקל.`},
 {l:'a',t:'mc',q:`בציור של שני מטענים A ו־B: מ־A יוצאים 12 קווים. 4 מהם נכנסים ל־B, ו־8 ממשיכים לאינסוף. מה נכון?`,o:['A חיובי, B שלילי, |q_A| = 3|q_B|','A חיובי, B שלילי, |q_A| = |q_B|','שניהם חיוביים','A שלילי, B חיובי'],a:0,s:`קווים יוצאים ממטען חיובי ונכנסים לשלילי. 12 קווים מול 4 קווים: היחס בין גודלי המטענים הוא 3.`}
 ]},
{id:'equipotential',title:'קווים שווי פוטנציאל',sub:'נקודות בעלות אותו פוטנציאל, ניצבות לקווי השדה',
 intro:[
 `<b>קו שווה פוטנציאל</b> מחבר נקודות בעלות אותו פוטנציאל. במרחב התלת־ממדי אלה משטחים.`,
 `הקווים שווי הפוטנציאל <b>ניצבים לקווי השדה</b> בכל נקודה.`,
 `העבודה בהעברת מטען לאורך קו שווה פוטנציאל היא אפס, כי ${m('<i>V</i><sub>AB</sub> = 0')}.`,
 `כשמציירים את הקווים בהפרשי פוטנציאל שווים, הם צפופים במקום שבו השדה חזק.`,
 `סביב מטען נקודתי: מעגלים קונצנטריים שהמרווחים ביניהם גדלים ככל שמתרחקים מהמטען. בשדה אחיד: קווים ישרים מקבילים במרווחים שווים.`,
 `פני מוליך בשיווי משקל הם משטח שווה פוטנציאל, והשדה בתוך המוליך הוא אפס.`],
 formulas:[[`<i>W</i><sub>A→B</sub> = <i>qV</i><sub>AB</sub> = 0`,'עבודה לאורך קו שווה פוטנציאל'],[`<i>E</i> ≈ ${fr('Δ<i>V</i>','Δ<i>x</i>')}`,'גודל השדה מהמרווח בין קווים שכנים']],
 trap:[`מרווחים שווים בפוטנציאל ≠ מרווחים שווים במרחק`,`סביב מטען נקודתי, הקווים של ${m('180 kV')}, ${m('90 kV')} ו־${m('60 kV')} נמצאים ברדיוסים של 10, 20 ו־30 cm. הרדיוסים במרווחים שווים, אבל הפרשי הפוטנציאל לא שווים (90 kV ואחר כך 30 kV). בהפרשי פוטנציאל שווים המעגלים מתרחקים זה מזה.`],
 ex:{given:[`מטען נקודתי ${m('<i>Q</i> = +2 μC')}`,`מטען מועבר ${m('<i>q</i> = +1 nC')}`],ask:[`א. מה הרדיוסים של הקווים שווי הפוטנציאל ${m('180 kV')}, ${m('90 kV')} ו־${m('60 kV')}?`,`ב. מה העבודה של הכוח החשמלי בהעברת q מהקו של 180 kV לקו של 60 kV?`,`ג. ואם מעבירים את q לאורך הקו של 90 kV?`],
  steps:[
  `<b>סעיף א.</b> ${m(`<i>r</i> = ${fr('<i>kQ</i>','<i>V</i>')} = ${fr('9·10<sup>9</sup>·2·10<sup>−6</sup>','<i>V</i>')} = ${fr('1.8·10<sup>4</sup>','<i>V</i>')}`)}, ולכן ${m('<i>r</i> = 0.1 m, 0.2 m, 0.3 m')}.`,
  `<b>סעיף ב.</b> ${m('<i>W</i> = <i>qV</i><sub>AB</sub> = 10<sup>−9</sup>·(1.8·10<sup>5</sup> − 6·10<sup>4</sup>) = 1.2·10<sup>−4</sup> J')}. העבודה חיובית: מטען חיובי שהתרחק מהמטען החיובי.`,
  `<b>סעיף ג.</b> לאורך קו שווה פוטנציאל ${m('<i>V</i><sub>AB</sub> = 0')}, ולכן ${m('<i>W</i> = 0')}. הכוח ניצב בכל רגע לכיוון התנועה.`],
  check:`בסימולציה, טענו "מטען יחיד" עם ${m('+2 μC')}. הקווים מצוירים כל 30 kV, ותוכלו לזהות את המעגלים של 180, 90 ו־60 kV.`},
 qs:[
 {l:'b',t:'mc',q:`מה הזווית בין קו שדה לקו שווה פוטנציאל בנקודת המפגש ביניהם?`,o:['0°','45°','90°','תלוי בשדה'],a:2,s:`לאורך קו שווה פוטנציאל V לא משתנה, ולכן לשדה אין רכיב לאורכו. השדה ניצב לקו.`},
 {l:'b',t:'num',q:`מה הרדיוס של הקו שווה הפוטנציאל של ${m('90 V')} סביב מטען נקודתי של ${m('+3 nC')}?`,a:.3,u:'m',s:`${m(`<i>r</i> = ${fr('<i>kQ</i>','<i>V</i>')} = ${fr('9·10<sup>9</sup>·3·10<sup>−9</sup>','90')} = 0.3 m`)}`},
 {l:'b',t:'mc',q:`מעבירים מטען לאורך קו שווה פוטנציאל. מה העבודה של הכוח החשמלי?`,o:['חיובית','שלילית','אפס','תלויה בגודל המטען'],a:2,s:`${m('<i>W</i> = <i>qV</i><sub>AB</sub>')}, ובין שתי נקודות על אותו קו ${m('<i>V</i><sub>AB</sub> = 0')}.`},
 {l:'a',t:'num',q:`קווים שווי פוטנציאל מצוירים כל ${m('10 V')}. באזור A המרווח בין קווים שכנים הוא ${m('1 cm')}, ובאזור B הוא ${m('2 cm')}. מה בקירוב גודל השדה באזור A?`,a:1000,u:'V/m',s:`${m(`<i>E</i> ≈ ${fr('Δ<i>V</i>','Δ<i>x</i>')} = ${fr('10','0.01')} = 1000 V/m`)}. באזור B השדה בערך 500 V/m: קווים צפופים פי 2, שדה חזק פי 2.`},
 {l:'a',t:'mc',q:`כדור מוליך טעון במטען ${m('+<i>Q</i>')} ונמצא בשיווי משקל. מה נכון לגבי נקודה בתוך הכדור?`,o:['E = 0 ו־V = 0','E = 0 ו־V שווה לפוטנציאל על פני הכדור','E ≠ 0 ו־V קבוע','E ו־V גדלים לכיוון המרכז'],a:1,s:`בתוך מוליך בשיווי משקל ${m('<i>E</i> = 0')}. כש־E אפס הפוטנציאל לא משתנה, ולכן בכל נקודה בפנים הוא שווה לפוטנציאל על פני הכדור, ${m('<i>kQ</i>/<i>R</i>')}. הוא לא אפס.`}
 ]}

function topic(id,tab){
  const i=T.findIndex(t=>t.id===id),t=T[i];curTab=tab||'learn';
  const tabs=[['learn','הסבר'],['sim','סימולציה'],['ex','דוגמה פתורה'],['qs','תרגול']];
  app.innerHTML=`<div class="wrap"><div class="th"><a class="crumb" href="#">כל הנושאים</a><h1>${i+1}. ${t.title}</h1><p>${t.sub}</p></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${k===curTab}">${l}</button>`).join('')}</div>
  <div class="panel" id="panel"></div>
  <nav class="pn">${i>0?`<a class="btn" href="#${T[i-1].id}">→ ${T[i-1].title}</a>`:'<span></span>'}${i<T.length-1?`<a class="btn pri" href="#${T[i+1].id}">${T[i+1].title} ←</a>`:`<a class="btn pri" href="#formulas">לדף הנוסחאות ←</a>`}</nav></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;app.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));panel(t,curTab)});
  panel(t,curTab);
}
function panel(t,tab,preset){
  killScenes();const p=document.getElementById('panel');
  if(tab==='learn'){p.innerHTML=`<div class="prose">${t.intro.map(x=>`<p>${x}</p>`).join('')}</div>${t.formulas.length?`<div><h2>הנוסחאות בנושא</h2><div class="fgrid">${t.formulas.map(f=>`<div class="fc">${M(f[0])}<small>${f[1]}</small></div>`).join('')}</div></div>`:''}${TIPS[t.id]?`<div class="tips"><h2>טיפים לפתרון</h2><ul>${TIPS[t.id].map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}<div class="trap"><h2>${t.trap[0]}</h2><p>${t.trap[1]}</p></div><div><button class="btn pri" data-go="sim">לסימולציה ←</button></div>`}
  if(tab==='sim'){p.innerHTML='<div class="panel" style="padding:0" id="simhost"></div>';SIMS[t.id](p.querySelector('#simhost'),preset)}
  if(tab==='ex'){const e=t.ex;p.innerHTML=`<article class="ex"><div class="gf"><div><h3>נתונים</h3>${e.given.map(g=>`<p>${g}</p>`).join('')}</div><div><h3>מבוקש</h3>${e.ask.map(g=>`<p>${g}</p>`).join('')}</div></div><div><h3>פתרון</h3><ol class="steps">${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div><div class="chk"><h3>בדיקה</h3><p>${e.check}</p></div></article><div><button class="btn pri" data-pre="1">פתיחת הדוגמה בסימולציה ←</button></div>`}
  if(tab==='qs')practice(t,p);
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(t,b.dataset.go));
  p.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>setTab(t,'sim',true));
}
function setTab(t,k,preset){curTab=k;app.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===k));panel(t,k,preset);document.querySelector('.tabs').scrollIntoView({block:'nearest'})}
function practice(t,p){
  const lv=[['b','שאלות בסיסיות','הבנת המושגים והצבה ישירה'],['a','שאלות מתקדמות','ברמת בגרות, משלבות כמה רעיונות']];
  p.innerHTML=`<div class="score" id="score"></div>`+lv.map(([l,h,s])=>`<section class="panel" style="padding:0;gap:14px" data-l="${l}"><div class="lvl"><h2>${h}</h2><span>${s}</span></div></section>`).join('')+`<p class="note">בשאלות חישוב אפשר לכתוב מספרים כמו <span class="mx">2.88e5</span> או <span class="mx">2.88*10^5</span>. תשובה נחשבת נכונה בטווח של 3%.</p>`;
  const upd=()=>{const s=topicStats(t);p.querySelector('#score').innerHTML=`נפתרו: בסיסיות ${s.sb}/${s.b} · מתקדמות ${s.sa}/${s.a}`};upd();
  const n={b:0,a:0};
  t.qs.forEach((q,qi)=>{const id=t.id+'-'+qi;n[q.l]++;const box=el(`<div class="q ${q.l==='a'?'adv':''}"><div class="qn"><span>${q.l==='a'?'מתקדמת':'בסיסית'} ${n[q.l]}</span><span class="st ${solved[id]?'ok':''}">${solved[id]?'✓ נפתרה':''}</span></div><p>${q.q}</p>${q.fig?FIG[q.fig]():''}</div>`);
    const st=box.querySelector('.st');const good=()=>{markSolved(id);st.textContent='✓ נפתרה';st.classList.add('ok');upd()};
    const sol=el(`<div class="sol" hidden><b>פתרון</b><p>${q.s}</p></div>`);
    if(q.t==='mc'){const o=el('<div class="opts"></div>');const fb=el('<div class="fb" hidden></div>');q.o.forEach((txt,k)=>{const b=el(`<button class="opt">${txt}</button>`);b.onclick=()=>{o.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok')});if(k===q.a){fb.className='fb ok';fb.textContent='נכון.';good()}else{b.classList.add('no');fb.className='fb no';fb.textContent='לא נכון. התשובה הנכונה מסומנת בירוק.'}fb.hidden=false;sol.hidden=false};o.appendChild(b)});box.append(o,fb,sol)}
    else{const fid='a'+id;const row=el(`<div class="ansrow"><label class="tip" for="${fid}">התשובה שלכם:</label><input id="${fid}" inputmode="decimal" autocomplete="off"><span class="u">${q.u}</span><button class="btn sm pri">בדיקה</button><button class="btn sm">הצגת פתרון</button></div>`);const fb=el('<div class="fb" hidden></div>');const[inp]=row.querySelectorAll('input');const[chk,show]=row.querySelectorAll('button');
      const check=()=>{const v=parseNum(inp.value);fb.hidden=false;if(isNaN(v)){fb.className='fb';fb.textContent='לא הצלחנו לקרוא את המספר. נסו למשל 4.5e5 או 0.54.';return}const ok=Math.abs(v-q.a)<=Math.abs(q.a)*.03+1e-12;if(ok){fb.className='fb ok';fb.innerHTML='נכון. ';good();sol.hidden=false}else{const sign=Math.sign(v)!==Math.sign(q.a)&&v!==0;fb.className='fb no';fb.textContent=sign?'הסימן לא נכון. בדקו את הסימנים של המטענים או את כיוון התנועה.':Math.abs(Math.log10(Math.abs(v/q.a))%1)<.02&&(Math.abs(v/q.a)>5||Math.abs(v/q.a)<.2)?'הספרות נכונות אבל סדר הגודל לא. בדקו יחידות (μC, cm, nC).':'עדיין לא. נסו שוב, או פתחו את הפתרון.'}};
      chk.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});show.onclick=()=>{sol.hidden=!sol.hidden};box.append(row,fb,sol)}
    p.querySelector(`[data-l="${q.l}"]`).appendChild(box)});
}
function route(){killScenes();const h=location.hash.replace('#','');document.getElementById('nav-f').toggleAttribute('aria-current',h==='formulas');document.getElementById('nav-home').toggleAttribute('aria-current',!h);
  if(T.some(t=>t.id===h))topic(h);else if(h==='formulas')formulas();else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>

</body></html>
