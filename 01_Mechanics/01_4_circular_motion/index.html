<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תנועה מעגלית - מכניקה</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-secondary: #555555;
            --accent-blue: #0070f3;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }
        .header-section {
            text-align: center;
            padding: 10px 0 30px;
        }
        .header-section h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .header-section p {
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .card {
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .card-btn {
            display: inline-block;
            width: 100%;
            padding: 12px 24px;
            background-color: var(--accent-blue);
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .card-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← חזרה למכניקה</a>

        <div class="header-section">
            <h1>תנועה מעגלית</h1>
            <p>סימולציות וחומרי תרגול בנושא תנועה מעגלית קצובה ודינמיקה</p>
        </div>

        <div class="card">
            <div class="card-icon">🎡</div>
            <h2>דינמיקה של תנועה מעגלית</h2>
            <p>סימולציה אינטראקטיבית לחקר כוחות, תאוצה רדיאלית ומהירות בתנועה מעגלית.</p>
            <a href="circular_motion_dynamics.html" class="card-btn">הפעל סימולציה</a>
        </div>
    </div>
</body>
</html>
