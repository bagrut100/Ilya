<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כבידה - מכניקה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0e14; --card-bg: #ffffff; --text-main: #111827; --text-secondary: #4b5563; --accent-blue: #0070f3; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', system-ui, sans-serif; }
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #172033 0%, #0b0e14 60%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 25px 20px 60px; }
        .container { width: 100%; max-width: 960px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 24px; }
        .back-link { color: #60a5fa; text-decoration: none; font-weight: 700; }
        .breadcrumbs { color: #94a3b8; font-size: 0.9rem; }
        .header-section { text-align: center; padding: 10px 0 36px; }
        .header-section h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
        .header-section p { color: #94a3b8; font-size: 1.05rem; }
        .card { background: var(--card-bg); color: var(--text-main); border-radius: 16px; padding: 28px; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 12px 30px rgba(0,0,0,0.25); transition: transform 0.25s; border-top: 5px solid var(--accent-blue); }
        .card:hover { transform: translateY(-6px); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
        .icon-box { width: 52px; height: 52px; border-radius: 14px; background: #eff6ff; color: var(--accent-blue); display: flex; align-items: center; justify-content: center; }
        .icon-box svg { width: 26px; height: 26px; stroke-width: 2; }
        .badge { font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; }
        .card h2 { font-size: 1.35rem; margin-bottom: 8px; }
        .card p { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
        .card-btn { display: flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 10px; background-color: var(--accent-blue); color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="../index.html" class="back-link">← חזרה למכניקה</a>
            <span class="breadcrumbs">ראשי / מכניקה / כבידה</span>
        </div>
        <div class="header-section">
            <h1>כבידה ותנועת לוויינים</h1>
            <p>סימולציה אינטראקטיבית לחקר חוק הכבידה העולמי, מסלולים ומהירות מילוט</p>
        </div>
        <div class="card">
            <div>
                <div class="card-top">
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/><circle cx="19" cy="8" r="1.5"/></svg>
                    </div>
                    <span class="badge">סימולציה</span>
                </div>
                <h2>סימולציית כבידה ולוויינים</h2>
                <p>שיגור לוויינים למסלול מעגלי ואליפטי, חוקי קפלר ומהירות הקפה.</p>
            </div>
            <a href="gravity_simulation.html" class="card-btn">הפעל סימולציה ←</a>
        </div>
    </div>
</body>
</html>
