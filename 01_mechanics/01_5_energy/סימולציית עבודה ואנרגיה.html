<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סימולציית עבודה ואנרגיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* layout idea: parameters column on the right (RTL), scene in the centre, energy bars + table under the scene */
:root{
  color-scheme: light;
  --bg:#edf1f7; --surface:#ffffff; --ink:#13203a; --muted:#56637c; --line:#d3dae6;
  --accent:#0b5cd6; --accent-soft:#e3edfd; --good:#12803c; --bad:#c62828; --zero:#6b7280;
  --cK:#e4572e; --cUg:#2b7fd9; --cUk:#12a184; --cQ:#e09a00; --cW:#8a3ffc; --cE:#1f2a44;
  --font: "Rubik", "Arial Hebrew", Arial, "Noto Sans Hebrew", sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4}
.num,.ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px 6px}
h1{font-size:1.7rem;margin:0;font-weight:700;letter-spacing:.01em}
h1 small{font-weight:400;color:var(--muted);font-size:1rem;margin-inline-start:10px}
.gsel{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-weight:500}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;font:inherit;padding:4px 14px;cursor:pointer;color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px 0}
nav button{font:inherit;font-size:1.15rem;font-weight:500;padding:10px 22px;border:2px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;background:#dfe6f1;color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);border-color:var(--accent);color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.wrap{background:var(--surface);border-top:2px solid var(--accent);padding:14px 20px 28px}
.presetbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;margin-bottom:12px}
.presetbar label{font-weight:500;padding-top:8px}
select,input[type=number]{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.presetbar select{max-width:100%;min-width:260px}
.question{flex:1 1 420px;border:2px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 16px;font-size:1.2rem;font-weight:500}
.question[hidden]{display:none}
.question details{font-weight:400;font-size:1rem;margin-top:4px;color:var(--muted)}
.question summary{cursor:pointer}
.grid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
.panel{display:flex;flex-direction:column;gap:10px}
fieldset{border:1.5px solid var(--line);border-radius:var(--r);padding:8px 12px 10px;margin:0;min-width:0}
legend{font-weight:700;padding:0 6px;color:var(--accent)}
.row{display:grid;grid-template-columns:1fr;gap:2px;margin:6px 0}
.row label{font-size:.98rem}
.row .unit{color:var(--muted);font-size:.88rem}
.ctl{display:flex;gap:8px;align-items:center}
.ctl input[type=range]{flex:1;min-width:0;height:26px;accent-color:var(--accent)}
.ctl input[type=number]{width:88px;text-align:center}
.row select{width:100%}
.check{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.hint{color:var(--muted);font-size:.88rem;margin:2px 0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.quick button,.btn{font:inherit;border:1.5px solid var(--line);background:#f4f7fb;border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.scene{position:relative;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:#f9fbfe}
.scene canvas{display:block;width:100%;height:46vh;min-height:330px;touch-action:none}
#wcv{height:400px;min-height:0}
.hud{position:absolute;top:8px;left:10px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;pointer-events:none}
.hud span{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.status{position:absolute;bottom:8px;right:10px;left:10px;text-align:center;pointer-events:none}
.status b{display:inline-block;background:#fff;border:2px solid var(--zero);border-radius:999px;padding:3px 16px;font-size:1.1rem}
.status b.warn{border-color:var(--bad);color:var(--bad)}
.status b:empty{display:none}
.loopinfo{border:1.5px dashed var(--accent);border-radius:var(--r);padding:6px 14px;font-size:1.08rem}
.transport{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.transport .big{font:inherit;font-size:1.1rem;font-weight:500;padding:8px 18px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer}
.transport .big.primary{background:var(--accent);color:#fff;min-width:118px}
.transport .big.toggle{border-color:var(--ink);color:var(--ink)}
.speed{display:flex;align-items:center;gap:8px}
.speed input{width:140px;accent-color:var(--accent)}
.below{display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,6fr);gap:16px;align-items:start}
.card{border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.card h2{font-size:1.08rem;margin:0 0 6px;font-weight:700}
#bars{display:block;width:100%;height:330px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1rem}
th,td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:center}
th:first-child,td:first-child{text-align:start;white-space:nowrap}
thead th{background:#f1f5fb;font-weight:700}
td.v{direction:ltr;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:baseline}
.eq{direction:ltr;text-align:center;font-size:1.3rem;padding:8px 4px;overflow-x:auto}
.eq div{margin:4px 0}
.wbox{border:3px solid var(--zero);border-radius:var(--r);padding:8px 14px;background:#f6f7f9}
.wbox.pos{border-color:var(--good);background:#eaf7ee}
.wbox.neg{border-color:var(--bad);background:#fdecec}
.wbox .tag{font-weight:700;font-size:1.15rem}
.wbox.pos .tag{color:var(--good)} .wbox.neg .tag{color:var(--bad)} .wbox .tag{color:var(--zero)}
#gcv{display:block;width:100%;height:300px;touch-action:none}
[hidden]{display:none!important}
@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .below{grid-template-columns:1fr}
  .stage{order:-1}
  h1{font-size:1.35rem}
}
@media (min-width:1700px){ body{font-size:19px} .grid{grid-template-columns:400px minmax(0,1fr)} }
</style>
</head>
<body>
<header>
  <h1>עבודה ואנרגיה <small>סימולציה לפיזיקה 5 יח"ל</small></h1>
  <div class="gsel"><span>תאוצת הכובד <span class="ltr">g [m/s²]</span></span>
    <span class="seg" id="gseg"><button type="button" data-g="10" aria-pressed="true">10</button><button type="button" data-g="9.8" aria-pressed="false">9.8</button></span>
  </div>
</header>
<nav id="tabs" role="tablist">
  <button type="button" role="tab" data-tab="work">עבודה של כוח</button>
  <button type="button" role="tab" data-tab="incline">מישור משופע</button>
  <button type="button" role="tab" data-tab="coaster">רכבת הרים</button>
  <button type="button" role="tab" data-tab="free">מצב חופשי</button>
</nav>
<div class="wrap">
  <div class="presetbar">
    <label for="preset">תרגיל מוכן:</label>
    <select id="preset"></select>
    <div class="question" id="question" hidden></div>
  </div>

  <!-- ===== tabs with motion ===== -->
  <div class="grid" id="simView">
    <aside class="panel" id="simPanel"></aside>
    <div class="stage">
      <div class="scene">
        <canvas id="cv"></canvas>
        <div class="hud" id="hud"><span id="hT"></span><span id="hV"></span><span id="hH"></span><span id="hN"></span></div>
        <div class="status"><b id="status"></b></div>
      </div>
      <div class="loopinfo ltr" id="loopinfo" hidden></div>
      <div class="transport">
        <button type="button" class="big primary" id="bPlay">▶ הפעל</button>
        <button type="button" class="big" id="bStep">⏭ צעד</button>
        <button type="button" class="big" id="bReset">↺ אפס</button>
        <label class="speed" for="speed">מהירות הרצה <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1" dir="ltr"><span class="num" id="speedV">×1.0</span></label>
        <label class="check"><input type="checkbox" id="cTrail">השאר עקבה</label>
        <label class="check"><input type="checkbox" id="cMarks">נקודות A ו‑B</label>
        <button type="button" class="big toggle" id="bHide">הסתר תשובות</button>
      </div>
      <div class="below">
        <div class="card"><h2>עמודות אנרגיה <span class="ltr">[J]</span></h2><canvas id="bars"></canvas></div>
        <div class="card">
          <h2 id="tblTitle">מצב התחלתי ← מצב סופי</h2>
          <div class="tblwrap"><table id="tbl"></table></div>
          <h2 style="margin-top:10px">עבודת הכוחות לאורך הדרך <span class="ltr">[J]</span></h2>
          <div class="tblwrap"><table id="wtbl"></table></div>
          <h2 style="margin-top:10px">מאזן האנרגיה</h2>
          <div class="eq" id="eq"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== tab 1: work of a force ===== -->
  <div class="grid" id="workView" hidden>
    <aside class="panel" id="workPanel"></aside>
    <div class="stage">
      <div class="scene"><canvas id="wcv"></canvas></div>
      <div class="transport">
        <button type="button" class="big primary" id="wPlay">▶ הפעל</button>
        <span class="hint">אפשר לגרור את הגוף כדי לשנות את ההעתק d</span>
      </div>
      <div class="wbox" id="wbox"><div class="tag" id="wtag"></div><div class="eq" id="weq"></div></div>
      <div class="card"><h2>גרף הכוח כתלות במקום – העבודה שווה לשטח שמתחת לגרף</h2><canvas id="gcv"></canvas>
        <div class="hint" id="ghint"></div></div>
    </div>
  </div>
</div>
<script>
/* ===== Physics engine: motion of a point mass along a track, arc-length coordinate s ===== */
var Phys = (function () {
  'use strict';
  var DS = 0.01;          // track sampling step, m
  var SPRING_L0 = 1.5;    // natural length of the spring, m
  var SPRING_PAD = 1.0;   // free horizontal run in front of the spring, m

  /* ---------- track builder ("turtle"): lines, arcs, spline spans ---------- */
  function Builder(x, y, th) {
    this.X = []; this.Y = []; this.T = []; this.K = []; this.S = [];
    this.x = x; this.y = y; this.th = th; this.s = 0;
  }
  Builder.prototype._p = function (x, y, th, k, s) {
    this.X.push(x); this.Y.push(y); this.T.push(th); this.K.push(k); this.S.push(s);
  };
  Builder.prototype.turn = function (th) { this.th = th; return this; };   // ideal corner, speed preserved
  Builder.prototype.line = function (len) {
    if (!(len > 1e-9)) return this;
    var n = Math.max(1, Math.ceil(len / DS)), c = Math.cos(this.th), sn = Math.sin(this.th);
    this._p(this.x, this.y, this.th, 0, this.s);
    for (var i = 1; i <= n; i++) {
      var d = len * i / n;
      this._p(this.x + c * d, this.y + sn * d, this.th, 0, this.s + d);
    }
    this.x += c * len; this.y += sn * len; this.s += len;
    return this;
  };
  Builder.prototype.arc = function (R, dth) {           // dth > 0: left turn (counter-clockwise)
    var sg = dth >= 0 ? 1 : -1, len = R * Math.abs(dth);
    if (!(len > 1e-9)) return this;
    var n = Math.max(2, Math.ceil(len / DS)), k = sg / R;
    var cx = this.x - sg * R * Math.sin(this.th), cy = this.y + sg * R * Math.cos(this.th);
    this._p(this.x, this.y, this.th, k, this.s);
    for (var i = 1; i <= n; i++) {
      var th = this.th + dth * i / n;
      this._p(cx + sg * R * Math.sin(th), cy - sg * R * Math.cos(th), th, k, this.s + len * i / n);
    }
    this.x = cx + sg * R * Math.sin(this.th + dth); this.y = cy - sg * R * Math.cos(this.th + dth);
    this.th += dth; this.s += len;
    return this;
  };
  Builder.prototype.spline = function (pts) {           // uniform Catmull-Rom through pts
    var n = pts.length, N = 300;
    function P(i) {
      if (i < 0) return [2 * pts[0][0] - pts[1][0], 2 * pts[0][1] - pts[1][1]];
      if (i >= n) return [2 * pts[n - 1][0] - pts[n - 2][0], 2 * pts[n - 1][1] - pts[n - 2][1]];
      return pts[i];
    }
    var lastTh = null;
    for (var i = 0; i < n - 1; i++) {
      var p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2), px = 0, py = 0;
      for (var j = 0; j <= N; j++) {
        var u = j / N, q = [0, 0], d1 = [0, 0], d2 = [0, 0];
        for (var c = 0; c < 2; c++) {
          var a1 = -p0[c] + p2[c], a2 = 2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c], a3 = -p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c];
          q[c] = 0.5 * (2 * p1[c] + a1 * u + a2 * u * u + a3 * u * u * u);
          d1[c] = 0.5 * (a1 + 2 * a2 * u + 3 * a3 * u * u);
          d2[c] = 0.5 * (2 * a2 + 6 * a3 * u);
        }
        var sp = Math.hypot(d1[0], d1[1]) || 1e-9;
        var th = Math.atan2(d1[1], d1[0]);
        if (lastTh !== null) { while (th - lastTh > Math.PI) th -= 2 * Math.PI; while (th - lastTh < -Math.PI) th += 2 * Math.PI; }
        lastTh = th;
        var k = (d1[0] * d2[1] - d1[1] * d2[0]) / (sp * sp * sp);
        if (j > 0) this.s += Math.hypot(q[0] - px, q[1] - py);
        this._p(q[0], q[1], th, k, this.s);
        px = q[0]; py = q[1];
      }
      this.x = px; this.y = py; this.th = lastTh;
    }
    return this;
  };
  Builder.prototype.done = function (meta) {
    var tr = { X: this.X, Y: this.Y, T: this.T, K: this.K, S: this.S, n: this.S.length, len: this.s, meta: meta || {} };
    var xs = tr.X, ys = tr.Y;
    tr.xmin = Math.min.apply(null, xs); tr.xmax = Math.max.apply(null, xs);
    tr.ymin = Math.min.apply(null, ys); tr.ymax = Math.max.apply(null, ys);
    return tr;
  };

  /* cfg: {type:'flat'|'incline'|'coaster'|'loop', flatLen, theta(rad), L, run, pts, R, H, spring:{on,side}} */
  function buildTrack(cfg) {
    var sp = cfg.spring && cfg.spring.on ? cfg.spring.side : null;
    var ext = SPRING_L0 + SPRING_PAD, b, meta = { type: cfg.type, pre: 0 };
    var x0 = 0, y0 = 0, th0 = 0;
    if (cfg.type === 'incline') { y0 = cfg.L * Math.sin(cfg.theta); th0 = -cfg.theta; }
    if (cfg.type === 'coaster') { x0 = cfg.pts[0][0]; y0 = cfg.pts[0][1]; }
    var PHI = 50 * Math.PI / 180, RF = 1.2;
    if (cfg.type === 'loop') { y0 = cfg.H; th0 = -PHI; }
    if (sp === 'start' && cfg.type !== 'flat') {      // horizontal section with a spring before the track
      b = new Builder(x0 - ext, y0, 0); b.line(ext); meta.pre = ext;
    } else b = new Builder(x0, y0, 0);
    if (cfg.type === 'flat') {
      b.line(cfg.flatLen);
    } else if (cfg.type === 'incline') {
      b.turn(th0).line(cfg.L); meta.corner = b.s;
      b.turn(0).line(Math.max(cfg.run, sp === 'end' ? ext : 0));
    } else if (cfg.type === 'coaster') {
      b.spline(cfg.pts);
      if (sp === 'end') b.turn(0).line(ext);
    } else if (cfg.type === 'loop') {
      var drop = RF * (1 - Math.cos(PHI));
      if (cfg.H > drop + 0.05) { b.turn(th0).line((cfg.H - drop) / Math.sin(PHI)).arc(RF, PHI); }
      else { var ph = Math.acos(Math.max(-1, 1 - cfg.H / RF)); b.turn(-ph).arc(RF, ph); }
      b.turn(0).line(1.5);
      meta.loopS0 = b.s; meta.loopTop = b.s + Math.PI * cfg.R; meta.loopS1 = b.s + 2 * Math.PI * cfg.R;
      meta.R = cfg.R; meta.cx = b.x; meta.cy = b.y + cfg.R;
      b.arc(cfg.R, 2 * Math.PI).turn(0).line(Math.max(4, sp === 'end' ? ext + 1 : 0));
    }
    var tr = b.done(meta);
    if (sp) tr.spring = { sigma: sp === 'end' ? 1 : -1, sf: sp === 'end' ? tr.len - SPRING_L0 : SPRING_L0, L0: SPRING_L0, maxX: 0.92 * SPRING_L0 };
    return tr;
  }

  function sample(tr, s, o) {
    o = o || {};
    if (s < 0) s = 0; else if (s > tr.len) s = tr.len;
    var S = tr.S, lo = 0, hi = tr.n - 2;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (S[mid] <= s) lo = mid; else hi = mid - 1; }
    var d = S[lo + 1] - S[lo], f = d > 0 ? (s - S[lo]) / d : 0;
    o.x = tr.X[lo] + f * (tr.X[lo + 1] - tr.X[lo]);
    o.y = tr.Y[lo] + f * (tr.Y[lo + 1] - tr.Y[lo]);
    o.th = tr.T[lo] + f * (tr.T[lo + 1] - tr.T[lo]);
    o.k = tr.K[lo] + f * (tr.K[lo + 1] - tr.K[lo]);
    return o;
  }
  function nearestS(tr, x, y) {          // arc coordinate of the track point closest to (x,y)
    var best = 0, bd = Infinity;
    for (var i = 0; i < tr.n; i++) { var d = (tr.X[i] - x) * (tr.X[i] - x) + (tr.Y[i] - y) * (tr.Y[i] - y); if (d < bd) { bd = d; best = i; } }
    return tr.S[best];
  }

  /* ---------- simulation ----------
     p: {m,g,mu,muS,fricMode:'none'|'all'|'zone',zone:[a,b],F,beta(rad),k,attached,x0,s0,v0,markers:{A,B}|null} */
  function Sim(tr, p) { this.tr = tr; this.p = p; this._a = {}; this._b = {}; this.reset(); }

  Sim.prototype.muAt = function (s, stat) {
    var p = this.p;
    if (p.fricMode === 'none') return 0;
    if (p.fricMode === 'zone' && (s < p.zone[0] || s > p.zone[1])) return 0;
    return stat ? Math.max(p.muS, p.mu) : p.mu;
  };
  Sim.prototype.springX = function (s) {            // compression (+) / extension (-); 0 when not in contact
    var sp = this.tr.spring; if (!sp) return 0;
    var x = sp.sigma * (s - sp.sf);
    return (this.p.attached || x > 0) ? x : 0;
  };
  /* forces at (s,v): N, tangential sum without friction T, components */
  Sim.prototype.forces = function (s, v, o) {
    var p = this.p, q = sample(this.tr, s, o);
    var sp = this.tr.spring;
    o.Ft = p.F * Math.cos(p.beta); o.Fn = p.F * Math.sin(p.beta);
    o.Fs = sp ? -sp.sigma * p.k * this.springX(s) : 0;
    o.N = p.m * v * v * q.k + p.m * p.g * Math.cos(q.th) - o.Fn;
    o.T = -p.m * p.g * Math.sin(q.th) + o.Ft + o.Fs;
    o.mu = this.muAt(s, false);
    return o;
  };
  Sim.prototype.snap = function (s, v, Q, W, t) { return { s: s, v: v, Q: Q, W: W, t: t }; };
  Sim.prototype.derive = function (sn, zeroY) {
    var p = this.p, q = sample(this.tr, sn.s), x = this.springX(sn.s);
    var K = 0.5 * p.m * sn.v * sn.v, Ug = p.m * p.g * (q.y - zeroY), Uk = 0.5 * p.k * x * x;
    if (!this.tr.spring) Uk = 0;
    return { s: sn.s, y: q.y, h: q.y - zeroY, v: sn.v, x: x, K: K, Ug: Ug, Uk: Uk, E: K + Ug + Uk, Q: sn.Q, W: sn.W, t: sn.t };
  };

      { q: 'מהו הגובה המינימלי H שממנו יש לשחרר קרונית כדי שתעבור לולאה אנכית חלקה ברדיוס R?', a: 'H = 2.5R  (כאן R = 2 m, H = 5 m; בשיא N = 0 ו‑v² = gR)', set: { type: 'loop', R: 2, H: 5 } },
      { q: 'הקרונית משוחררת מגובה H = 2.4R. האם תשלים את הלולאה? היכן תתנתק מהמסילה?', a: 'לא. מתנתקת בגובה R(1 + 2·1.4/3) ≈ 3.87 m', set: { type: 'loop', R: 2, H: 4.8 } },
      { q: 'קרונית משוחררת ממנוחה מגובה 5 m על מסילה חלקה. האם תעבור גבעה שגובהה 4 m? מה מהירותה בשיא הגבעה (נקודה B)?', a: 'כן. v = √(2g·Δh) = √20 ≈ 4.47 m/s', set: { type: 'coaster', tpl: 'hill', pts: clone(TPL.hill) }, post: function (P) { P.markers = true; P.sA = 0; P.sB = Phys.nearestS(track, 13, 4); } },
      { q: 'קרונית משוחררת ממנוחה מגובה 5 m. לפניה גבעה בגובה 3.5 m ואחריה גבעה בגובה 5.5 m. האם תעבור את הגבעה השנייה? לאיזה גובה תגיע?', a: 'לא. בלי חיכוך היא חוזרת בדיוק לגובה 5 m ומתנודדת.', set: { type: 'coaster', tpl: 'two', pts: clone(TPL.two) } },
      { q: 'קרונית משוחררת ממנוחה מגובה 6 m לעמק שבתחתיתו רצועה מחוספסת (μ = 0.1). כמה אנרגיה הופכת לחום בכל מעבר? היכן תיעצר הקרונית?', a: 'עקבו אחרי העמודה Q. הקרונית נעצרת כאשר Q = mg·(6 − h הסופי).', set: { type: 'coaster', tpl: 'valley', pts: clone(TPL.valley), fricMode: 'zone', zone: [6.5, 14], mu: 0.1, muS: 0.1 } }
    ],
    free: [
      { q: 'גוף נע על משטח אופקי עם μ = 0.2 במהירות 6 m/s. איזה מרחק יעבור עד לעצירה?', a: '½mv² = μmg·d  ⇒  d = 9 m', set: { type: 'flat', flatLen: 14, s0: 1, v0: 6, fricMode: 'all', mu: 0.2, muS: 0.2 } },
      { q: 'גוף שמסתו 0.5 kg דוחס קפיץ k = 200 N/m בשיעור 0.1 m ומשוחרר על משטח חלק. מה מהירותו לאחר שניתק מהקפיץ?', a: '½kx² = ½mv²  ⇒  v = 2 m/s', set: { type: 'flat', flatLen: 8, m: 0.5, spOn: true, spSide: 'start', k: 200, x0: 0.1 } },
      { q: 'ארגז שמסתו 2 kg נמצא במנוחה. כוח אופקי 12 N מושך אותו על משטח עם μ = 0.2. מה מהירותו לאחר 5 m (נקודה B)?', a: '(F − μmg)·d = ½mv²  ⇒  v = √40 ≈ 6.32 m/s', set: { type: 'flat', flatLen: 14, m: 2, s0: 1, Fon: true, F: 12, beta: 0, fricMode: 'all', mu: 0.2, muS: 0.2, markers: true, sA: 1, sB: 6 } },
      { q: 'גוף שמסתו 1 kg נע במהירות 4 m/s, עובר רצועה מחוספסת באורך 2 m (μ = 0.2) ופוגע בקפיץ k = 100 N/m. מהו הכיווץ המרבי?', a: '½mv² − μmg·d = ½kx²  ⇒  x ≈ 0.283 m', set: { type: 'flat', flatLen: 12, m: 1, s0: 1, v0: 4, fricMode: 'zone', zone: [3, 5], mu: 0.2, muS: 0.2, spOn: true, spSide: 'end', k: 100 } }
    ]
  };
  function fillPresets() {
    var s = $('preset'); s.innerHTML = ''; var o = el('option', null, '— בחרו תרגיל —'); o.value = ''; s.appendChild(o);
    PRE[G.tab].forEach(function (p, i) { var e = el('option', null, (i + 1) + '. ' + (p.q.length > 62 ? p.q.slice(0, 60) + '…' : p.q)); e.value = i; s.appendChild(e); });
    $('question').hidden = true;
  }
  $('preset').addEventListener('change', function () {
    var q = $('question'); if (this.value === '') { q.hidden = true; return; }
    var p = PRE[G.tab][+this.value], k;
    q.hidden = false; q.innerHTML = ''; q.appendChild(el('div', null, p.q));
    var d = el('details'); d.appendChild(el('summary', null, 'הצג תשובה')); d.appendChild(el('div', 'ltr', p.a)); q.appendChild(d);
    if (G.tab === 'work') { Wk.fric = false; Wk.varMode = false; for (k in p.set) Wk[k] = p.set[k]; Wk.prog = 1; Wk.anim = false; workChanged(); return; }
    var P = defaults(ST[G.tab].type); for (k in p.set) P[k] = clone(p.set[k]); ST[G.tab] = P;
    rebuild(); if (p.post) { p.post(P); rebuild(); }
    $('cMarks').checked = P.markers; refresh('sim');
  });

  /* ================= tabs, g, main loop ================= */
  function setTab(t) {
    G.tab = t;
    document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === t ? 'true' : 'false'); });
    $('workView').hidden = t !== 'work'; $('simView').hidden = t === 'work';
    fillPresets();
    if (t === 'work') workChanged(); else { rebuild(); $('cMarks').checked = cur().markers; refresh('sim'); }
    try { localStorage.setItem('we_tab', t); } catch (e) { }
  }
  document.querySelectorAll('#tabs button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
  document.querySelectorAll('#gseg button').forEach(function (b) {
    b.addEventListener('click', function () {
      G.g = parseFloat(b.dataset.g);
      document.querySelectorAll('#gseg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      if (G.tab === 'work') workChanged(); else simChanged();
    });
  });

  var last = 0, trailT = 0;
  function frame(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    if (G.tab === 'work') {
      if (Wk.anim) { Wk.prog = Math.min(1, Wk.prog + dt / 2.2); if (Wk.prog >= 1) Wk.anim = false; if (Wk.varMode) updateWorkEq(); }
      drawWork(); drawGraph();
    } else {
      if (running) {
        sim.advance(dt * G.speed, HSTEP);
        if (sim.t - trailT > 0.04 || sim.t < trailT) { trailT = sim.t; pushTrail(); }
        if (!active()) { running = false; setPlayLabel(); lastUi = 0; }
      }
      var st = drawSim(); drawBars(st); updateUi(st, ts);
    }
    requestAnimationFrame(frame);
  }

  buildSimPanel(); buildWorkPanel(); buildTables();
  var start = 'incline'; try { var sv = localStorage.getItem('we_tab'); if (sv && (PRE[sv])) start = sv; } catch (e) { }
  setTab(start);
  window.addEventListener('resize', function () { if (G.tab !== 'work') fitView(); });
  window.addEventListener('load', function () { lastUi = 0; ['eq', 'weq'].forEach(function (id) { Array.prototype.forEach.call($(id).children, function (c) { c._tex = null; }); }); if (G.tab === 'work') updateWorkEq(); });
  window.__sim = function () { return { sim: sim, track: track, P: cur(), G: G, Wk: Wk, workCalc: workCalc }; };
  requestAnimationFrame(frame);
})();

</script>
