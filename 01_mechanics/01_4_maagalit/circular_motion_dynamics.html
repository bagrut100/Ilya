<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תנועה מעגלית: דינמיקה</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1c2731; --muted:#5b6b78; --line:#cfd8dc;
    --accent:#0b5cad; --accent-ink:#ffffff; --ok:#1b5e20; --okbg:#e8f5e9; --bad:#b71c1c; --badbg:#ffebee;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI","Arial Hebrew",Arial,"Noto Sans Hebrew",sans-serif;font-size:17px;color:var(--ink);
       background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
  .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  header.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 18px;background:var(--card);
       border-bottom:1px solid var(--line)}
  header.top h1{font-size:24px;margin:0;white-space:nowrap}
  #tabs{display:flex;gap:6px;flex-wrap:wrap}
  #tabs button{font:inherit;font-weight:600;font-size:17px;padding:9px 14px;border:2px solid var(--line);
       background:#fff;color:var(--ink);border-radius:10px;cursor:pointer}
  #tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  #tabs button:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
  main.layout{flex:1;min-height:610px;display:grid;grid-template-columns:clamp(250px,22vw,340px) minmax(0,1fr) clamp(250px,22vw,340px);gap:12px;padding:12px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow-y:auto;min-height:0}
  .panel h2{font-size:19px;margin:4px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .panel section+section, .panel details{margin-top:14px}
  .stage{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
  .canvasWrap{flex:1;min-height:420px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .status{min-height:46px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:17px;background:var(--okbg);color:var(--ok);
       border:1px solid #a5d6a7}
  .status.bad{background:var(--badbg);color:var(--bad);border-color:#ef9a9a}
  .status.info{background:#e3f2fd;color:#0d47a1;border-color:#90caf9}
  .transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:8px 12px}
  .btn{font:inherit;font-weight:700;font-size:17px;padding:9px 16px;border-radius:10px;border:2px solid var(--accent);
       background:#fff;color:var(--accent);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);color:#fff}
  .btn[aria-pressed="true"]{background:#ffb300;border-color:#ff8f00;color:#1c2731}
  .btn:disabled{opacity:.45;cursor:default}
  .grow{flex:1;min-width:170px;display:flex;align-items:center;gap:8px}
  .seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{font:inherit;font-weight:600;padding:7px 12px;border:0;background:#fff;color:var(--ink);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:8px 12px}
  .chips .cap{font-weight:700}
  .chip{font:inherit;font-weight:700;font-size:16px;padding:7px 13px;border-radius:999px;border:2px solid var(--accent);
       background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="false"]{background:#fff;color:#7a8791;border-color:var(--line);text-decoration:line-through}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{font:inherit;font-weight:700;padding:7px 11px;border-radius:9px;border:2px solid var(--line);background:#fff;color:var(--accent);cursor:pointer}
  /* sliders */
  .prm{margin:10px 0 14px}
  .prm .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
  .prm .val{white-space:nowrap;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0;direction:ltr}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:#cfd8dc}
  input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:#cfd8dc}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);
       border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-9px;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid #fff;
       box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
  .opt{margin:8px 0 12px}
  .opt .cap{font-weight:600;margin-bottom:4px}
  label.chk{display:flex;align-items:center;gap:9px;padding:5px 2px;cursor:pointer;font-weight:600}
  label.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
  .sw{width:26px;height:8px;border-radius:4px;flex:none}
  .sw.acc{height:0;border-top:4px dashed;background:none!important;border-radius:0}
  /* readouts */
  .row{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed #e0e6ea}
  .row .he{flex:1}
  .row .sy{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-weight:700;font-size:19px}
  .row .vl{font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;text-align:left}
  details>summary{cursor:pointer;font-size:19px;font-weight:700;padding:6px 0;border-bottom:2px solid var(--line)}
  #formulas h4{margin:12px 0 4px;font-size:17px;color:var(--accent)}
  #formulas p{margin:6px 0;line-height:1.45}
  .fm{direction:ltr;text-align:left;unicode-bidi:isolate;font-family:"Cambria Math","Times New Roman",serif;font-size:20px;
      background:#f4f6f8;border-radius:8px;padding:6px 10px;margin:5px 0;overflow-x:auto;white-space:nowrap}
  .note{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:8px 10px;font-weight:600}
  #quizBox{display:flex;flex-direction:column;gap:8px}
  #quizInfo{font-weight:600;color:var(--muted);min-height:24px}
  footer#legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 18px;background:var(--card);
      border-top:1px solid var(--line);font-size:16px;font-weight:600}
  footer#legend .it{display:flex;align-items:center;gap:7px}
  footer#legend .sy{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-weight:700}
  @media (max-width:1000px){
    html,body{height:auto}
    main.layout{grid-template-columns:1fr;flex:none;min-height:0}
    .stage{order:-1}
    .canvasWrap{min-height:62vh}
    .panel{overflow:visible}
  }
</style>
</head>
<body>
<header class="top">
  <h1>תנועה מעגלית: דינמיקה</h1>
  <nav id="tabs" role="tablist" aria-label="תרחישים"></nav>
</header>

<main class="layout">
  <aside class="panel" id="info">
    <section>
      <h2>ערכים בזמן אמת</h2>
      <div id="readouts"></div>
    </section>
    <details id="fbox" open>
      <summary>נוסחאות</summary>
      <div id="formulas"></div>
    </details>
  </aside>

  <section class="stage">
    <div class="transport">
      <button class="btn primary" id="bPlay"></button>
      <button class="btn" id="bStep">צעד</button>
      <button class="btn" id="bReset">איפוס</button>
      <div class="grow">
        <label for="spd" style="font-weight:600;white-space:nowrap">מהירות הנפשה</label>
        <input type="range" id="spd" min="0.05" max="2" step="0.05" value="1">
        <span class="ltr" id="spdVal" style="font-weight:700;min-width:54px">×1.00</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="ltr" style="font-weight:700">g =</span>
        <div class="seg" id="gSeg">
          <button type="button" data-g="10" aria-pressed="true"><span class="ltr">10 m/s²</span></button>
          <button type="button" data-g="9.8" aria-pressed="false"><span class="ltr">9.8 m/s²</span></button>
        </div>
      </div>
    </div>
    <div class="chips" id="chips" aria-label="מה מוצג בשרטוט">
      <span class="cap">הצג:</span>
      <button type="button" class="chip" data-k="forces">כוחות</button>
      <button type="button" class="chip" data-k="sum">שקול <span class="ltr"><i>ΣF</i></span></button>
      <button type="button" class="chip" data-k="aR">תאוצה <span class="ltr"><i>a<sub>R</sub></i></span></button>
      <button type="button" class="chip" data-k="v">מהירות <span class="ltr"><i>v</i></span></button>
      <button type="button" class="chip" data-k="axes">צירים</button>
      <button type="button" class="chip" data-k="comps">רכיבים</button>
      <button type="button" class="chip" data-k="nums">ערכים מספריים</button>
    </div>
    <div class="canvasWrap" id="wrap"><canvas id="cv"></canvas></div>
    <div id="status" class="status" role="status"></div>
  </section>

  <aside class="panel" id="ctl">
    <section>
      <h2>פרמטרים</h2>
      <div id="params"></div>
    </section>
    <section>
      <h2>תצוגה</h2>
      <div id="showList"></div>
    </section>
    <section>
      <h2>שאלה לכיתה</h2>
      <div id="quizBox">
        <button class="btn" id="bQuiz" aria-pressed="false">הסתר וקטורים – שרטטו בעצמכם</button>
        <button class="btn" id="bNext" disabled>הצג וקטור הבא</button>
        <button class="btn" id="bAll" disabled>הצג הכול</button>
        <div id="quizInfo"></div>
      </div>
    </section>
  </aside>
</main>

<footer id="legend" aria-label="מקרא צבעים"></footer>

<script>
"use strict";
/* =====================================================================
   Circular motion dynamics - interactive simulation (single file, offline)
   Structure:
     1. constants, helpers, global UI state
     2. vector registry (one fixed colour per vector type in all scenarios)
     3. canvas drawing helpers
     4. scenarios: Disk, Pendulum, Bank, Turn, Loop (common interface)
     5. UI wiring, main loop
   Scenario interface:
     id, title, p (parameter values), o (option values)
     options()  -> option descriptors      params() -> slider descriptors
     forceKeys()-> force vector keys        extraKeys() -> other vector keys
     reset()    step(dt, dtReal)   derive() -> fills this.d
     draw(ctx,W,H)   readouts() -> rows   formulas() -> html   status() -> {html, lvl}
   ===================================================================== */

/* ---------- 1. constants & helpers ---------- */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const $ = s => document.querySelector(s);
const ltr = s => '<bdi dir="ltr" class="ltr">' + s + '</bdi>';

/** number formatting that never prints NaN or "-0.00" */
function num(x, d = 2) {
  if (Number.isNaN(x)) return '—';
  if (!Number.isFinite(x)) return '∞';
  const r = x.toFixed(d);
  return Number(r) === 0 ? (0).toFixed(d) : r;
}
/** force formatting: N, or kN for large values */
function fN(F) {
  if (!Number.isFinite(F)) return '∞';
  const a = Math.abs(F);
  if (a >= 1e4) return num(F / 1000, a >= 1e6 ? 0 : 1) + ' kN';
  return num(F, a >= 100 ? 1 : 2) + ' N';
}
const deg = (rad, d = 1) => num(rad / DEG, d) + '°';

/* global UI state */
const UI = {
  g: 10, running: true, speed: 1, sc: null,
  quiz: false, revealed: new Set(),
  show: { mg: true, N: true, T: true, f: true, Lift: true, Rg: true, sum: true, aR: true, at: true, a: false, v: true, axes: true, comps: false, forces: true, nums: true }
};

/* ---------- 2. vector registry: fixed colour system ---------- */
const VEC = {
  mg:   { color: '#d32f2f', he: 'כוח הכובד',                 sym: { b: 'mg' },          html: 'mg' },
  N:    { color: '#1565c0', he: 'כוח נורמלי',                sym: { b: 'N' },           html: 'N' },
  T:    { color: '#7b1fa2', he: 'מתיחות החוט',               sym: { b: 'T' },           html: 'T' },
  f:    { color: '#ef6c00', he: 'כוח חיכוך',                 sym: { b: 'f' },           html: 'f' },
  Lift: { color: '#00897b', he: 'כוח עילוי',                 sym: { b: 'L' },           html: 'L' },
  Rg:   { color: '#3949ab', he: 'תגובת המשטח (N+f)',         sym: { b: 'F', s: 'N+f' }, html: 'F<sub>N+f</sub>' },
  sum:  { color: '#111111', he: 'כוח שקול',                  sym: { b: 'ΣF' },          html: 'ΣF' },
  aR:   { color: '#2e7d32', he: 'תאוצה רדיאלית (צנטריפטלית)', sym: { b: 'a', s: 'R' },   html: 'a<sub>R</sub>', acc: true },
  at:   { color: '#c2185b', he: 'תאוצה משיקית',              sym: { b: 'a', s: 'τ' },   html: 'a<sub>τ</sub>', acc: true },
  a:    { color: '#6d4c41', he: 'תאוצה כוללת',               sym: { b: 'a' },           html: 'a',             acc: true },
  v:    { color: '#546e7a', he: 'מהירות',                    sym: { b: 'v' },           html: 'v' }
};
const AXIS_COLOR = '#7a8791';
const FORCE_KEYS = ['mg', 'N', 'T', 'f', 'Lift', 'Rg'];

/** is the vector with this key currently drawn? (handles class-question mode) */
function visible(key) {
  if (key === 'v') return UI.show.v;
  if (UI.quiz) return UI.revealed.has(key);
  if (FORCE_KEYS.indexOf(key) >= 0 && !UI.show.forces) return false;     // master switch "forces"
  return UI.show[key] !== false;
}
const compsOn = key => UI.show.comps && visible(key);

/* ---------- 3. canvas helpers ---------- */
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function line(ctx, x1, y1, x2, y2, color, w = 1.5, dash) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
/** plain text with a white halo. o: {size,color,align,base,rtl,bold} */
function label(ctx, str, x, y, o = {}) {
  ctx.save();
  ctx.font = (o.bold ? '700 ' : '600 ') + (o.size || 15) + 'px "Segoe UI",Arial,sans-serif';
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  try { ctx.direction = o.rtl ? 'rtl' : 'ltr'; } catch (e) { /* old browsers */ }
  ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.92)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = o.color || '#263238'; ctx.fillText(str, x, y);
  ctx.restore();
}
/** arrow. o: {width, head, dash, hollow} */
function arrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  if (!(len >= 1)) return;
  const w = o.width || 4, hl = Math.min(o.head || 15, len * 0.6), ux = dx / len, uy = dy / len, hw = hl * 0.5;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hl * 0.85, y2 - uy * hl * 0.85); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - ux * hl - uy * hw, y2 - uy * hl + ux * hw);
  ctx.lineTo(x2 - ux * hl + uy * hw, y2 - uy * hl - ux * hw);
  ctx.closePath();
  if (o.hollow) { ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = Math.max(2, w * 0.7); ctx.stroke(); }
  else ctx.fill();
  ctx.restore();
}
/** math symbol: italic letter, optional subscript, optional vector arrow above. s: {b, s, vec} */
function sym(ctx, x, y, s, color, size = 21) {
  ctx.save();
  try { ctx.direction = 'ltr'; } catch (e) { /* ignore */ }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  const fMain = 'italic 700 ' + size + 'px "Cambria Math","Times New Roman",serif';
  const fSub = 'italic 700 ' + Math.round(size * 0.66) + 'px "Cambria Math","Times New Roman",serif';
  ctx.font = fMain; const wb = ctx.measureText(s.b).width;
  let ws = 0; if (s.s) { ctx.font = fSub; ws = ctx.measureText(s.s).width + 1; }
  const x0 = x - (wb + ws) / 2, y0 = y + size * 0.32;
  ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 4; ctx.fillStyle = color;
  ctx.font = fMain; ctx.strokeText(s.b, x0, y0); ctx.fillText(s.b, x0, y0);
  if (s.s) { ctx.font = fSub; ctx.strokeText(s.s, x0 + wb + 1, y0 + size * 0.22); ctx.fillText(s.s, x0 + wb + 1, y0 + size * 0.22); }
  if (s.vec !== false) {              // small arrow above the letter
    const ay = y0 - size * 0.84, ax2 = x0 + wb + 1;
    ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, ay); ctx.lineTo(ax2, ay);
    ctx.moveTo(ax2 - 5, ay - 3.5); ctx.lineTo(ax2, ay); ctx.lineTo(ax2 - 5, ay + 3.5); ctx.stroke();
  }
  ctx.restore();
}
/** draw a registered vector (force / acceleration / velocity) with its label.
    o.side: perpendicular label shift (px); o.shift: perpendicular shift of the whole arrow (px) */
function drawVec(ctx, key, ox, oy, dx, dy, o = {}) {
  if (!visible(key)) return;
  const V = VEC[key], len = Math.hypot(dx, dy);
  if (!(len >= 2)) return;
  const ux = dx / len, uy = dy / len;
  if (o.shift) { ox += -uy * o.shift; oy += ux * o.shift; }
  arrow(ctx, ox, oy, ox + dx, oy + dy, V.color,
    V.acc ? { width: 3.5, hollow: true, dash: [8, 5] } : { width: key === 'sum' ? 5.5 : (key === 'v' ? 3 : 4.2) });
  const side = o.side || 0;
  sym(ctx, ox + dx + ux * 20 - uy * side, oy + dy + uy * 20 + ux * side, V.sym, V.color);
}
/** two dashed components c1 + c2 of a force, with closing guide lines */
function drawComps(ctx, key, ox, oy, c1, c2, n1, n2) {
  if (!compsOn(key)) return;
  const col = VEC[key].color, b = VEC[key].sym.b;
  const tx = ox + c1[0] + c2[0], ty = oy + c1[1] + c2[1];
  [[c1, n1], [c2, n2]].forEach(([c, n]) => {
    const len = Math.hypot(c[0], c[1]); if (!(len >= 4)) return;
    arrow(ctx, ox, oy, ox + c[0], oy + c[1], col, { width: 2, dash: [6, 4], head: 10 });
    line(ctx, ox + c[0], oy + c[1], tx, ty, col, 1, [3, 4]);
    sym(ctx, ox + c[0] + c[0] / len * 16, oy + c[1] + c[1] / len * 16, { b, s: n, vec: false }, col, 17);
  });
}
/** coordinate axes at (ox,oy); ex, ey are screen vectors (already with length) */
function drawAxes(ctx, ox, oy, ex, ey, lx = 'x', ly = 'y') {
  if (!UI.show.axes) return;
  [[ex, lx], [ey, ly]].forEach(([e, l]) => {
    const len = Math.hypot(e[0], e[1]); if (!(len >= 6)) return;
    line(ctx, ox - e[0] * 0.25, oy - e[1] * 0.25, ox, oy, AXIS_COLOR, 1.5);
    arrow(ctx, ox, oy, ox + e[0], oy + e[1], AXIS_COLOR, { width: 1.6, head: 9 });
    sym(ctx, ox + e[0] + e[0] / len * 8 + e[1] / len * 13, oy + e[1] + e[1] / len * 8 - e[0] / len * 13, { b: l, vec: false }, AXIS_COLOR, 18);
  });
}
/** common force scale (px per newton) inside one scenario */
const fScale = (mg, Fmax) => Math.min(88 / Math.max(mg, 1e-9), 200 / Math.max(Fmax, 1e-9));

/** top-view inset box geometry */
function topBox(W, H) {
  const S = clamp(Math.min(W, H) * 0.36, 150, 230);
  return { x: 12, y: 12, S, cx: 12 + S / 2, cy: 12 + S / 2 + 11, rmax: S / 2 - 36 };
}
/** top view: circle, body, tangent velocity, a_R to the centre.
    o: {rp, bx, by (px, y up), tx, ty (unit tangent, y up), v, aR, onPath, diskR, diskAngle} */
function drawTopView(ctx, b, o) {
  ctx.save();
  rr(ctx, b.x, b.y, b.S, b.S, 12); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
  ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 1.5; ctx.stroke();

  rr(ctx, b.x + 1, b.y + 24, b.S - 2, b.S - 25, 10); ctx.clip();
  if (o.diskR) {
    ctx.beginPath(); ctx.arc(b.cx, b.cy, o.diskR, 0, TAU); ctx.fillStyle = '#eceff1'; ctx.fill();
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 2; ctx.stroke();

      const a = -(o.diskAngle || 0) + i * TAU / 6;

    }
  }
  ctx.beginPath(); ctx.arc(b.cx, b.cy, Math.max(o.rp, 0.5), 0, TAU);
  ctx.strokeStyle = '#607d8b'; ctx.lineWidth = 1.6; ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(b.cx, b.cy, 3.5, 0, TAU); ctx.fillStyle = '#37474f'; ctx.fill();

  if (onPath && o.rp > 4) line(ctx, b.cx, b.cy, bx, by, '#90a4ae', 1.2, [3, 3]);
  if (onPath && o.aR > 1e-6 && o.rp > 8 && visible('aR')) {
    const L = Math.min(o.rp * 0.62, 46), d = Math.hypot(b.cx - bx, b.cy - by) || 1;
    drawVec(ctx, 'aR', bx, by, (b.cx - bx) / d * L, (b.cy - by) / d * L, { side: 14 });
  }
  if (o.v > 1e-6) drawVec(ctx, 'v', bx, by, o.tx * 44, -o.ty * 44);
  ctx.beginPath(); ctx.arc(bx, by, 8, 0, TAU); ctx.fillStyle = '#263238'; ctx.fill();

}
/* ---- simple orthographic 3-D overview (camera raised by `elev`) ---- */
function make3D(cx, cy, s, elev) {
  const se = Math.sin(elev), ce = Math.cos(elev);
  return {
    s, P: (x, y, z) => [cx + s * x, cy - s * (y * se + z * ce)],     // point
    V: (x, y, z) => [s * x, -s * (y * se + z * ce)],                 // vector
    depth: (x, y, z) => y * ce - z * se                              // larger = farther from the camera
  };
}
function poly(ctx, pts, fill, stroke, lw = 1) {
  ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
}
const mixRGB = (a, b, t) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
/** split the canvas into an overview region (a) and a force-diagram region (b) */
function splitRegions(W, H) {
  if (W >= 700) { const wa = Math.round(W * 0.44); return { a: { x: 0, y: 0, w: wa, h: H }, b: { x: wa, y: 0, w: W - wa, h: H } }; }
  const ha = Math.round(H * 0.42); return { a: { x: 0, y: 0, w: W, h: ha }, b: { x: 0, y: ha, w: W, h: H - ha } };
}
function inRegion(ctx, r, title, bg, fn) {
  ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip(); ctx.translate(r.x, r.y);
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, r.w, r.h); }

}
/** ground ellipse, vertical axis and dashed radius for the overview pictures */
function draw3DCircleGuides(ctx, cam, bx, by, bz) {
  const O = cam.P(0, 0, 0), A = cam.P(0, 0, bz), B = cam.P(bx, by, bz);
  line(ctx, O[0], O[1], A[0], A[1] - 26, '#607d8b', 1.4, [5, 4]);

  sym(ctx, (A[0] + B[0]) / 2, (A[1] + B[1]) / 2 - 12, { b: 'R', vec: false }, '#263238', 18);

/** angle arc with a Greek label; canvas angles a0 -> a1 (clockwise) */
function angleArc(ctx, x, y, r, a0, a1, txt = 'α') {
  if (Math.abs(a1 - a0) < 0.012) return;
  ctx.save(); ctx.strokeStyle = '#455a64'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(x, y, r, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke(); ctx.restore();
  const am = (a0 + a1) / 2;

}
/** formula-panel helpers */
const fm = s => '<div class="fm" dir="ltr">' + s + '</div>';

/* ---------- 4.1 body on a rotating horizontal disk ---------- */
const Disk = {
  id: 'disk', title: 'סיבוב על דיסק',
  p: { R: 1.2, w: 2, m: 1, mu: 0.5 }, o: {}, RD: 2.35, K: 0.36,
  options() { return []; },
  params() {
    return [
      { key: 'R', he: 'רדיוס', sym: 'R', unit: 'm', min: 0.2, max: 2, step: 0.05, dec: 2 },
      { key: 'w', he: 'מהירות זוויתית', sym: 'ω', unit: 'rad/s', min: 0, max: 8, step: 0.05, dec: 2 },
      { key: 'm', he: 'מסה', sym: 'm', unit: 'kg', min: 0.1, max: 5, step: 0.1, dec: 1 },
      { key: 'mu', he: 'מקדם חיכוך סטטי', sym: 'μ', unit: '', min: 0.05, max: 1, step: 0.01, dec: 2 }
    ];
  },
  forceKeys() { return ['mg', 'N', 'f']; },
  extraKeys() { return ['sum', 'aR']; },
  reset() { this.th = 0; this.disk = 0; this.slip = null; this.derive(); },
  derive() {
    const p = this.p, g = UI.g, d = this.d = {};
    d.mg = p.m * g; d.N = d.mg; d.v = p.w * p.R; d.aR = p.w * p.w * p.R;
    d.fReq = p.m * d.aR; d.fMax = p.mu * d.N; d.ok = d.fReq <= d.fMax + 1e-9;

  step(dt) {

    }

    s.x += s.vx * dt; s.y += s.vy * dt;

  },
  draw(ctx, W, H) {
    const p = this.p, d = this.d, K = this.K, RD = this.RD, th = this.th, sl = this.slip;

    const P = (x, y, z) => [cx + s * x, cy - s * z - s * K * y];

    ctx.fillRect(cx - s * RD, cy, 2 * s * RD, 14);

      const a0 = this.disk + i * TAU / 12;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      for (let j = 0; j <= 6; j++) { const a = a0 + (TAU / 12) * j / 6, q = P(RD * Math.cos(a), RD * Math.sin(a), 0); ctx.lineTo(q[0], q[1]); }

    }
    ctx.beginPath(); ctx.ellipse(cx, cy, s * RD, s * RD * K, 0, 0, TAU); ctx.strokeStyle = '#78909c'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, s * p.R, s * p.R * K, 0, 0, TAU);
    ctx.strokeStyle = '#546e7a'; ctx.lineWidth = 1.6; ctx.setLineDash([7, 6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, TAU); ctx.fillStyle = '#37474f'; ctx.fill();

    const bw = sl ? [sl.x, sl.y, sl.z] : [p.R * Math.cos(th), p.R * Math.sin(th), 0];
    const B = P(bw[0], bw[1], bw[2]);
    const onDisk = !sl || Math.hypot(sl.x, sl.y) <= RD;
    if (!sl) {
      line(ctx, cx, cy, B[0], B[1], '#546e7a', 1.5, [5, 4]);
      sym(ctx, (cx + B[0]) / 2, (cy + B[1]) / 2 + 15, { b: 'R', vec: false }, '#37474f', 19);
    }
    const ox = B[0], oy = B[1] - 11;
    ctx.fillStyle = '#37474f'; rr(ctx, ox - 14, oy - 11, 28, 22, 5); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

/* ---------- 4.2 conical pendulum ---------- */
const Pendulum = {
  id: 'pend', title: 'מטוטלת חרוטית',
  p: { L: 1, a: 35, w: 4, m: 1 }, o: { mode: 'a' }, K: 0.36,
  options() { return [{ key: 'mode', type: 'seg', he: 'מה קובעים?', choices: [['a', 'זווית α'], ['w', 'מהירות זוויתית ω']] }]; },
  params() {
    const list = [{ key: 'L', he: 'אורך החוט', sym: 'L', unit: 'm', min: 0.3, max: 2, step: 0.05, dec: 2 }];
    if (this.o.mode === 'a') list.push({ key: 'a', he: 'זווית החוט מהאנך', sym: 'α', unit: '°', min: 1, max: 85, step: 0.5, dec: 1 });
    else list.push({ key: 'w', he: 'מהירות זוויתית', sym: 'ω', unit: 'rad/s', min: 0.5, max: 12, step: 0.05, dec: 2 });
    list.push({ key: 'm', he: 'מסה', sym: 'm', unit: 'kg', min: 0.1, max: 5, step: 0.1, dec: 1 });
    return list;
  },
  onOption() {                       // keep the state continuous when the control mode changes
    const d = this.d; if (!d) return;
    if (this.o.mode === 'w') this.p.w = clamp(Math.round(d.w * 20) / 20, 0.5, 12);
    else this.p.a = clamp(Math.round(d.al / DEG * 2) / 2, 1, 85);
  },
  forceKeys() { return ['mg', 'T']; },
  extraKeys() { return ['sum', 'aR']; },
  reset() { this.th = 0; this.derive(); },
  derive() {
    const p = this.p, g = UI.g, d = this.d = {};
    d.mg = p.m * g; d.hang = false;
    if (this.o.mode === 'a') {
      d.al = p.a * DEG; d.w = Math.sqrt(g / (p.L * Math.cos(d.al))); d.T = d.mg / Math.cos(d.al);
    } else {
      d.w = p.w; const c = g / (p.w * p.w * p.L);
      if (c >= 1) { d.al = 0; d.hang = true; d.T = d.mg; }       // too slow: the string stays vertical
      else { d.al = Math.acos(c); d.T = p.m * p.w * p.w * p.L; }
    }

    d.v = d.hang ? 0 : d.w * d.R; d.aR = d.hang ? 0 : d.w * d.w * d.R; d.sum = p.m * d.aR;

  },
  step(dt) { this.derive(); this.th += this.d.w * dt; },
  draw(ctx, W, H) {

    const s = Math.min((H - 235) / Lref, W * 0.3 / Math.max(d.R, 0.55 * Lref)), cx = W * 0.62, py = 62;
    const P = (x, y, zDown) => [cx + s * x, py + s * zDown - s * K * y];
    const pv = (vx, vy, vUp) => [vx, -vUp - K * vy];
    const B = P(d.R * Math.cos(th), d.R * Math.sin(th), d.Lc), C = P(0, 0, d.Lc), Bot = P(0, 0, p.L);
    // ceiling
    ctx.fillStyle = '#cfd8dc'; ctx.fillRect(cx - 80, py - 14, 160, 14);
    line(ctx, cx - 80, py, cx + 80, py, '#455a64', 3);
    for (let i = -72; i <= 72; i += 16) line(ctx, cx + i, py - 2, cx + i + 10, py - 13, '#78909c', 1.5);
    // axis, rest position, orbit
    line(ctx, cx, py, Bot[0], Bot[1], '#78909c', 1.5, [6, 5]);
    ctx.beginPath(); ctx.arc(Bot[0], Bot[1], 12, 0, TAU); ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    if (d.R * s > 2) {
      ctx.beginPath(); ctx.ellipse(C[0], C[1], s * d.R, s * d.R * K, 0, 0, TAU);
      ctx.strokeStyle = '#546e7a'; ctx.lineWidth = 1.6; ctx.setLineDash([7, 6]); ctx.stroke(); ctx.setLineDash([]);
      line(ctx, C[0], C[1], B[0], B[1], '#546e7a', 1.5, [5, 4]);
      label(ctx, 'R = L·sinα', C[0] + (B[0] - C[0]) * 0.3, C[1] + (B[1] - C[1]) * 0.3 + 16, { size: 15, color: '#37474f' });
    }
    // dimension ticks on the axis

    label(ctx, 'L·cosα', cx - 12, (py + C[1]) / 2 + 22, { size: 15, align: 'right', color: '#37474f' });
    if (Bot[1] - C[1] > 16) label(ctx, 'H = L − L·cosα', cx - 12, (C[1] + Bot[1]) / 2, { size: 15, align: 'right', color: '#37474f' });
    // string and angle
    line(ctx, cx, py, B[0], B[1], '#37474f', 3);
    const sa = Math.atan2(B[1] - py, B[0] - cx);
    angleArc(ctx, cx, py, 46, Math.PI / 2, sa, 'α');
    const sgn = B[0] >= cx ? 1 : -1;
    sym(ctx, (cx + B[0]) / 2 + 17 * sgn, (py + B[1]) / 2 - 4, { b: 'L', vec: false }, '#263238', 20);
    // bob
    const gr = ctx.createRadialGradient(B[0] - 4, B[1] - 4, 2, B[0], B[1], 14);
    gr.addColorStop(0, '#90a4ae'); gr.addColorStop(1, '#263238');
    ctx.beginPath(); ctx.arc(B[0], B[1], 13, 0, TAU); ctx.fillStyle = gr; ctx.fill();
    // vectors
    const sF = fScale(d.mg, d.T), ct = Math.cos(th), st = Math.sin(th), sa2 = Math.sin(d.al), ca2 = Math.cos(d.al);
    drawAxes(ctx, B[0], B[1], pv(-ct * 82, -st * 82, 0), [0, -82]);
    const Tx = pv(-ct * d.T * sa2 * sF, -st * d.T * sa2 * sF, 0), Ty = [0, -d.T * ca2 * sF];
    drawComps(ctx, 'T', B[0], B[1], Tx, Ty, 'x', 'y');

    drawVec(ctx, 'sum', B[0], B[1], sv[0], sv[1], { side: -18 });
    drawVec(ctx, 'aR', B[0], B[1], sv[0] * 0.72, sv[1] * 0.72, { shift: 15, side: 6 });
    if (d.v > 0.01) { const q = pv(-st * 66, ct * 66, 0); drawVec(ctx, 'v', B[0], B[1], q[0], q[1]); }
    if (UI.quiz) label(ctx, 'אילו כוחות פועלים על הגוף? שרטטו במחברת', W / 2 + 60, H - 22, { size: 17, rtl: true, color: '#0d47a1' });
    const b = topBox(W, H), rp = d.hang ? 0 : b.rmax * clamp(d.R / Math.max(p.L, 1e-9), 0.12, 1);
    drawTopView(ctx, b, { rp, bx: rp * ct, by: rp * st, tx: -st, ty: ct, v: d.v, aR: d.aR });
  },
  readouts() {
    const d = this.d;
    return [
      ['כוח הכובד', 'mg', fN(d.mg), 'mg'], ['מתיחות החוט', 'T', fN(d.T), 'T'],
      ['רכיב אופקי', 'T·sinα', fN(d.T * Math.sin(d.al)), 'T'], ['רכיב אנכי', 'T·cosα', fN(d.T * Math.cos(d.al)), 'T'],
      ['כוח שקול', 'ΣF', fN(d.sum), 'sum'],
      ['תאוצה צנטריפטלית', 'a<sub>R</sub>', num(d.aR) + ' m/s²', 'aR'],
      ['מהירות קווית', 'v', num(d.v) + ' m/s'], ['מהירות זוויתית', 'ω', num(d.w) + ' rad/s'],
      ['זמן מחזור', 'T', (d.hang ? '—' : num(d.per) + ' s')],
      ['זווית', 'α', deg(d.al)],
      ['רדיוס המעגל', 'R = L·sinα', num(d.R) + ' m'], ['', 'L·cosα', num(d.Lc) + ' m'],
      ['גובה מעל נקודת שיווי המשקל', 'H', num(d.Hh) + ' m']
    ];
  },
  status() {
    const d = this.d;
    if (d.hang) return { lvl: 'info', html: 'המהירות הזוויתית קטנה מ־' + ltr('√(g/L) = ' + num(Math.sqrt(UI.g / this.p.L)) + ' rad/s') + ' – החוט נשאר אנכי ' + ltr('(α = 0)') };
    return { lvl: 'ok', html: 'זמן המחזור: ' + ltr('T = 2π√(L·cosα/g) = ' + num(d.per) + ' s') + ' &nbsp;|&nbsp; ' + ltr('tanα = v²/(gR) = ' + num(Math.tan(d.al))) };
  },
  formulas() {
    return '<h4>ציר X (אל מרכז המעגל)</h4>' + fm('ΣF<sub>x</sub> = T·sinα = m·v²/R = m·ω²·R') +
      '<h4>ציר Y (אנכי)</h4>' + fm('ΣF<sub>y</sub> = T·cosα − mg = 0') +
      '<h4>גאומטריה</h4>' + fm('R = L·sinα &nbsp;,&nbsp; H = L − L·cosα') +
      '<h4>תוצאות</h4>' + fm('tanα = v²/(g·R) = ω²·R/g') + fm('ω² = g/(L·cosα)') +
      '<p>זמן המחזור:</p>' + fm('T = 2π·' + sq('L·cosα/g')) +
      '<p>זמן המחזור אינו תלוי במסה.</p>';
  }
};

/* ---------- 4.3 banked road (cross-section) ---------- */
const Bank = {
  id: 'bank', title: 'כביש מוגבה',
  p: { a: 20, R: 50, m: 1000, mu: 0.3, v: 15 }, o: { fr: false },
  options() { return [{ key: 'fr', type: 'check', he: 'עם חיכוך' }]; },
  params() {
    const list = [
      { key: 'a', he: 'זווית ההטיה', sym: 'α', unit: '°', min: 0, max: 80, step: 0.5, dec: 1 },
      { key: 'R', he: 'רדיוס הסיבוב', sym: 'R', unit: 'm', min: 10, max: 200, step: 1, dec: 0 },
      { key: 'm', he: 'מסה', sym: 'm', unit: 'kg', min: 500, max: 3000, step: 50, dec: 0 }
    ];
    if (this.o.fr) {
      list.push({ key: 'mu', he: 'מקדם חיכוך', sym: 'μ', unit: '', min: 0, max: 1, step: 0.01, dec: 2 });
      list.push({ key: 'v', he: 'מהירות', sym: 'v', unit: 'm/s', min: 0, max: 40, step: 0.1, dec: 1 });
    }
    return list;
  },
  forceKeys() { return this.o.fr ? ['mg', 'N', 'f'] : ['mg', 'N']; },
  extraKeys() { return ['sum', 'aR']; },
  reset() { this.th = 0; this.off = 0; this.derive(); },
  derive() {
    const p = this.p, g = UI.g, d = this.d = {};
    const al = d.al = p.a * DEG, sn = Math.sin(al), cs = Math.cos(al);
    d.mg = p.m * g; d.vDes = Math.sqrt(g * p.R * Math.tan(al));
    if (!this.o.fr) {
      d.v = d.vDes; d.N = d.mg / cs; d.f = 0; d.fMax = 0; d.ok = true; d.vmin = d.vmax = d.vDes;
    } else {
      d.v = p.v; const ac = d.v * d.v / p.R;
      d.N = p.m * (g * cs + ac * sn);
      d.f = p.m * (g * sn - ac * cs);          // > 0: friction points up the slope
      d.fMax = p.mu * d.N; d.ok = Math.abs(d.f) <= d.fMax + 1e-6;
      const den = cs - p.mu * sn, nm = sn - p.mu * cs;
      d.vmax = den > 1e-9 ? Math.sqrt(g * p.R * (sn + p.mu * cs) / den) : Infinity;
      d.vmin = nm > 0 ? Math.sqrt(g * p.R * nm / (cs + p.mu * sn)) : 0;
    }
    d.aR = d.v * d.v / p.R; d.sum = p.m * d.aR; d.w = d.v / p.R;
    d.per = d.v > 1e-6 ? TAU * p.R / d.v : Infinity;
  },
  step(dt, dtReal) {
    this.derive(); const d = this.d;
    this.th += d.w * dt;
    if (d.ok) this.off = 0;
    else this.off = clamp(this.off + (d.f < 0 ? 1 : -1) * 70 * dtReal, -125, 125);   // sliding up / down the slope
  },
  draw(ctx, W, H) {
    const r = splitRegions(W, H);
    inRegion(ctx, r.a, 'מבט כללי – מסלול מוטה', '#f6f8fa', (w, h) => this.draw3D(ctx, w, h));
    inRegion(ctx, r.b, 'חתך רוחב – תרשים כוחות', null, (w, h) => this.drawSection(ctx, w, h));
    if (r.a.h === H) line(ctx, r.a.w, 0, r.a.w, H, '#cfd8dc', 2); else line(ctx, 0, r.a.h, W, r.a.h, '#cfd8dc', 2);
  },
  /** velodrome-like overview: banked ring, car moving on it, v and a_R */
  draw3D(ctx, w, h) {
    const d = this.d, al = d.al, sn = Math.sin(al), cs = Math.cos(al), th = this.th;
    const s = Math.min(w * 0.36, (h - 70) / 1.9), cam = make3D(w / 2, h / 2 + 0.28 * s, s, 30 * DEG);
    const Ws = 0.56, ri = 1 - Ws / 2 * cs, ro = 1 + Ws / 2 * cs, zo = Ws * sn, n = 60, items = [];
    const ell = (R, z, fill, stroke, dash) => {
      ctx.beginPath(); for (let i = 0; i <= 72; i++) { const a = i * TAU / 72, q = cam.P(R * Math.cos(a), R * Math.sin(a), z); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
    };
    ell(1.42, 0, '#e9eef1'); ell(ri, 0, '#dcedc8');
    for (let i = 0; i < n; i++) {
      const a0 = i * TAU / n, a1 = a0 + TAU / n, am = a0 + TAU / n / 2, c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const sh = 0.5 + 0.5 * Math.cos(am - 2.2);
      items.push({ z: cam.depth(Math.cos(am), Math.sin(am), zo / 2), f: () => poly(ctx, [cam.P(ri * c0, ri * s0, 0), cam.P(ri * c1, ri * s1, 0), cam.P(ro * c1, ro * s1, zo), cam.P(ro * c0, ro * s0, zo)],
        mixRGB([176, 190, 197], [236, 239, 241], sh), 'rgba(84,110,122,.35)', 1) });
      if (zo > 0.004) items.push({ z: cam.depth(ro * Math.cos(am) * 1.02, ro * Math.sin(am) * 1.02, zo / 2), f: () => poly(ctx, [cam.P(ro * c0, ro * s0, zo), cam.P(ro * c1, ro * s1, zo), cam.P(ro * c1, ro * s1, 0), cam.P(ro * c0, ro * s0, 0)],
        mixRGB([84, 110, 122], [144, 164, 174], sh), 'rgba(55,71,79,.4)', 1) });
    }
    // car: a small box lying on the banked surface
    const ct = Math.cos(th), st = Math.sin(th), off = this.off / 125 * Ws * 0.36;
    const T = [-st, ct, 0], U = [cs * ct, cs * st, sn], N = [-sn * ct, -sn * st, cs];
    const base = [ct + U[0] * off, st + U[1] * off, zo / 2 + U[2] * off];
    const pt = (a, b, c) => [base[0] + T[0] * a + U[0] * b + N[0] * c, base[1] + T[1] * a + U[1] * b + N[1] * c, base[2] + T[2] * a + U[2] * b + N[2] * c];
    items.push({ z: cam.depth(base[0], base[1], base[2]) - 0.03, f: () => {
      const L = 0.19, Wd = 0.1, Hc = 0.11, v8 = [];
      for (const a of [-L, L]) for (const b of [-Wd, Wd]) for (const c of [0.012, Hc]) v8.push(pt(a, b, c));
      const faces = [[0, 1, 3, 2], [4, 5, 7, 6], [0, 1, 5, 4], [2, 3, 7, 6], [0, 2, 6, 4], [1, 3, 7, 5]];
      const cols = ['#37474f', '#37474f', '#455a64', '#455a64', '#263238', '#ffb300'];
      faces.map((fc, i) => ({ fc, i, z: fc.reduce((m, k) => m + cam.depth(v8[k][0], v8[k][1], v8[k][2]), 0) }))
        .sort((A, B) => B.z - A.z).forEach(o => poly(ctx, o.fc.map(k => cam.P(v8[k][0], v8[k][1], v8[k][2])), cols[o.i], '#fff', 1));
    } });
    items.sort((A, B) => B.z - A.z).forEach(o => o.f());
    const top = pt(0, 0, 0.12), B = cam.P(top[0], top[1], top[2]);
    draw3DCircleGuides(ctx, cam, top[0], top[1], top[2]);
    if (d.aR > 1e-6) { const q = cam.V(-ct * 0.5, -st * 0.5, 0); drawVec(ctx, 'aR', B[0], B[1], q[0], q[1], { side: 12 }); }
    if (d.v > 1e-6) { const q = cam.V(T[0] * 0.55, T[1] * 0.55, 0); drawVec(ctx, 'v', B[0], B[1], q[0], q[1]); }
    label(ctx, 'α = ' + deg(al), w / 2, h - 16, { size: 15, color: '#37474f' });
  },
  drawSection(ctx, W, H) {
    const p = this.p, d = this.d, al = d.al, sn = Math.sin(al), cs = Math.cos(al);
    const C0 = [W * 0.55, H * 0.62], u = [cs, -sn], n = [-sn, -cs], Lh = Math.min(200, W * 0.36);
    const P1 = [C0[0] - u[0] * Lh, C0[1] - u[1] * Lh], P2 = [C0[0] + u[0] * Lh, C0[1] + u[1] * Lh];
    const base = P1[1] + 26;
    // road wedge
    ctx.beginPath(); ctx.moveTo(P1[0], P1[1]); ctx.lineTo(P2[0], P2[1]); ctx.lineTo(P2[0], base); ctx.lineTo(P1[0] - 30, base); ctx.lineTo(P1[0] - 30, P1[1]); ctx.closePath();
    ctx.fillStyle = '#dfe5e8'; ctx.fill(); ctx.strokeStyle = '#607d8b'; ctx.lineWidth = 2; ctx.stroke();
    line(ctx, P1[0], P1[1], P2[0], P2[1], '#37474f', 5);
    line(ctx, 20, base, W - 20, base, '#78909c', 2);
    line(ctx, P1[0], P1[1], P1[0] + 110, P1[1], '#607d8b', 1.4, [5, 4]);
    angleArc(ctx, P1[0], P1[1], 62, -al, 0, 'α');
    label(ctx, 'אל מרכז המעגל ←', 22, base + 20, { size: 15, align: 'left', rtl: true, color: '#455a64' });
    // car (rear view) on the slope
    const C = [C0[0] + u[0] * this.off, C0[1] + u[1] * this.off];
    ctx.save(); ctx.translate(C[0], C[1]); ctx.rotate(-al);
    ctx.fillStyle = '#263238'; rr(ctx, -40, -18, 15, 18, 4); ctx.fill(); rr(ctx, 25, -18, 15, 18, 4); ctx.fill();
    ctx.fillStyle = '#90a4ae'; rr(ctx, -44, -46, 88, 34, 9); ctx.fill();
    ctx.fillStyle = '#b0bec5'; ctx.beginPath(); ctx.moveTo(-32, -46); ctx.lineTo(-24, -66); ctx.lineTo(24, -66); ctx.lineTo(32, -46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#eceff1'; ctx.beginPath(); ctx.moveTo(-25, -48); ctx.lineTo(-19, -62); ctx.lineTo(19, -62); ctx.lineTo(25, -48); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#546e7a'; rr(ctx, -38, -38, 14, 7, 3); ctx.fill(); rr(ctx, 24, -38, 14, 7, 3); ctx.fill();
    ctx.restore();
    const G = [C[0] + n[0] * 34, C[1] + n[1] * 34];             // centre of mass
    ctx.beginPath(); ctx.arc(G[0], G[1], 4, 0, TAU); ctx.fillStyle = '#111'; ctx.fill();
    // vectors
    const fShow = d.f;                                           // required friction (flagged in the status line when impossible)
    const sF = fScale(d.mg, Math.max(d.N, d.mg));
    drawAxes(ctx, G[0], G[1], [-86, 0], [0, -86]);
    drawComps(ctx, 'N', G[0], G[1], [n[0] * d.N * sF, 0], [0, n[1] * d.N * sF], 'x', 'y');
    if (this.o.fr) drawComps(ctx, 'f', G[0], G[1], [u[0] * fShow * sF, 0], [0, u[1] * fShow * sF], 'x', 'y');
    drawVec(ctx, 'mg', G[0], G[1], 0, d.mg * sF);
    drawVec(ctx, 'N', G[0], G[1], n[0] * d.N * sF, n[1] * d.N * sF);
    if (this.o.fr) drawVec(ctx, 'f', G[0], G[1], u[0] * fShow * sF, u[1] * fShow * sF);
    if (d.ok) {
      drawVec(ctx, 'sum', G[0], G[1], -d.sum * sF, 0, { side: 18 });
      drawVec(ctx, 'aR', G[0], G[1], -d.sum * sF * 0.72, 0, { shift: -15, side: -6 });
    }
    if (UI.quiz) label(ctx, 'אילו כוחות פועלים על המכונית? שרטטו במחברת', W / 2, 42, { size: 16, rtl: true, color: '#0d47a1' });
  },
  readouts() {
    const d = this.d, rows = [['כוח הכובד', 'mg', fN(d.mg), 'mg'], ['כוח נורמלי', 'N', fN(d.N), 'N']];
    if (this.o.fr) {
      rows.push([Math.abs(d.f) < 1e-6 ? 'חיכוך' : (d.f > 0 ? 'חיכוך (במעלה המדרון)' : 'חיכוך (במורד המדרון)'), 'f', fN(Math.abs(d.f)), 'f']);
      rows.push(['חיכוך סטטי מרבי', 'μN', fN(d.fMax), 'f']);
    }
    rows.push(['כוח שקול', 'ΣF', d.ok ? fN(d.sum) : '—', 'sum'], ['תאוצה צנטריפטלית', 'a<sub>R</sub>', num(d.aR) + ' m/s²', 'aR'],
      ['מהירות', 'v', num(d.v) + ' m/s'], ['', 'v', num(d.v * 3.6, 1) + ' km/h'],
      ['מהירות מתוכננת (ללא חיכוך)', 'v<sub>0</sub>', num(d.vDes) + ' m/s']);
    if (this.o.fr) rows.push(['מהירות מזערית', 'v<sub>min</sub>', num(d.vmin) + ' m/s'], ['מהירות מרבית', 'v<sub>max</sub>', num(d.vmax) + ' m/s']);
    rows.push(['זמן מחזור', 'T', num(d.per, 1) + ' s'], ['זווית ההטיה', 'α', deg(d.al)]);
    return rows;
  },
  status() {
    const d = this.d;
    if (!this.o.fr) return { lvl: 'ok', html: 'ללא חיכוך – הרכיב האופקי של הנורמל הוא הכוח הצנטריפטלי. מהירות מתוכננת: ' + ltr('v = √(gR·tanα) = ' + num(d.vDes) + ' m/s') };
    const rng = ltr(num(d.vmin) + ' ≤ v ≤ ' + num(d.vmax) + ' m/s');
    if (!d.ok) return { lvl: 'bad', html: (d.f < 0 ? 'מהירות גבוהה מדי – המכונית מחליקה במעלה המדרון (החוצה)! ' : 'מהירות נמוכה מדי – המכונית מחליקה במורד המדרון (פנימה)! ') + 'תחום מותר: ' + rng };
    const dir = Math.abs(d.f) < 1e-6 ? 'אין צורך בחיכוך' : (d.f > 0 ? 'החיכוך פועל במעלה המדרון' : 'החיכוך פועל במורד המדרון');
    return { lvl: 'ok', html: dir + '. תחום מהירויות מותר: ' + rng };
  },
  formulas() {
    let h = '<h4>ללא חיכוך – ציר X (אל מרכז המעגל)</h4>' + fm('ΣF<sub>x</sub> = N·sinα = m·v²/R') +
      '<h4>ציר Y (אנכי)</h4>' + fm('ΣF<sub>y</sub> = N·cosα − mg = 0') +
      '<h4>מהירות מתוכננת</h4>' + fm('tanα = v²/(g·R) &nbsp;⟹&nbsp; v = ' + sq('g·R·tanα'));
    if (this.o.fr) {
      h += '<h4>עם חיכוך (f במורד המדרון, v גדולה)</h4>' + fm('N·sinα + f·cosα = m·v²/R') + fm('N·cosα − f·sinα − mg = 0') +
        '<h4>עם חיכוך (f במעלה המדרון, v קטנה)</h4>' + fm('N·sinα − f·cosα = m·v²/R') + fm('N·cosα + f·sinα − mg = 0') +
        '<h4>תחום המהירויות (f ≤ μN)</h4>' +
        fm('v<sub>max</sub> = ' + sq('g·R·(sinα + μ·cosα)/(cosα − μ·sinα)')) +
        fm('v<sub>min</sub> = ' + sq('g·R·(sinα − μ·cosα)/(cosα + μ·sinα)')) +
        '<p>אם ' + ltr('μ ≥ tanα') + ' אז ' + ltr('v<sub>min</sub> = 0') + '; אם ' + ltr('μ·tanα ≥ 1') + ' אין מהירות מרבית.</p>';
    }
    return h;
  }
};

/* ---------- 4.4 turning bicycle / aeroplane (rear view) ---------- */
const Turn = {
  id: 'turn', title: 'פנייה של אופניים / מטוס',
  pv: { bike: { v: 6, R: 10, m: 80 }, plane: { v: 120, R: 2000, m: 50000 } },
  get p() { return this.pv[this.o.mode]; },
  o: { mode: 'bike', single: false },
  options() {
    const list = [{ key: 'mode', type: 'seg', he: 'כלי התחבורה', choices: [['bike', 'אופניים'], ['plane', 'מטוס']] }];
    if (this.o.mode === 'bike') list.push({ key: 'single', type: 'check', he: 'הצג את N ו־f כתגובה אחת' });
    return list;
  },
  params() {
    return this.o.mode === 'bike' ? [
      { key: 'v', he: 'מהירות', sym: 'v', unit: 'm/s', min: 0, max: 15, step: 0.1, dec: 1 },
      { key: 'R', he: 'רדיוס הסיבוב', sym: 'R', unit: 'm', min: 3, max: 50, step: 0.5, dec: 1 },
      { key: 'm', he: 'מסה (רוכב + אופניים)', sym: 'm', unit: 'kg', min: 40, max: 120, step: 1, dec: 0 }
    ] : [
      { key: 'v', he: 'מהירות', sym: 'v', unit: 'm/s', min: 50, max: 300, step: 1, dec: 0 },
      { key: 'R', he: 'רדיוס הסיבוב', sym: 'R', unit: 'm', min: 500, max: 8000, step: 50, dec: 0 },
      { key: 'm', he: 'מסה', sym: 'm', unit: 'kg', min: 1000, max: 100000, step: 1000, dec: 0 }
    ];
  },
  forceKeys() { return this.o.mode === 'plane' ? ['mg', 'Lift'] : (this.o.single ? ['mg', 'Rg'] : ['mg', 'N', 'f']); },
  extraKeys() { return ['sum', 'aR']; },
  reset() { this.th = 0; this.derive(); },
  derive() {
    const p = this.p, g = UI.g, d = this.d = {};
    d.mg = p.m * g; d.aR = p.v * p.v / p.R; d.sum = p.m * d.aR;
    d.al = Math.atan2(d.aR, g); d.big = Math.hypot(d.mg, d.sum);   // reaction / lift = mg / cos(alpha)
    d.w = p.v / p.R; d.per = p.v > 1e-6 ? TAU * p.R / p.v : Infinity;
  },
  step(dt) { this.derive(); this.th += this.d.w * dt; },
  draw(ctx, W, H) {

/* ---------- 4.5 vertical loop (track or string) ---------- */
const Loop = {
  id: 'loop', title: 'מעגל אנכי',
  p: { R: 1, h: 3, m: 0.5 }, o: { mode: 'track' }, BETA: 55 * DEG,
  options() {
    return [{ key: 'mode', type: 'seg', he: 'סוג התנועה', choices: [['track', 'בתוך מסילה'], ['string', 'על חוט']] },
      { type: 'actions', he: 'בחירת גובה מהירה', choices: [['h = R', 1], ['h = 2R', 2], ['h = 2.5R', 2.5], ['h = 3R', 3], ['h = 4R', 4]],
        run: k => { this.p.h = +(k * this.p.R).toFixed(2); this.reset(); } }];
  },
  /** drag on the ramp: choose the release height with the mouse / finger */
  pointer(type, x, y) {
    const vw = this.view; if (this.o.mode !== 'track' || !vw) return false;
    if (type === 'down') { if ((x - vw.ox) / vw.s > -0.3 * this.p.R) return false; this.drag = true; this.dragHv = vw.hv; }
    if (!this.drag) return false;
    if (type === 'up') { this.drag = false; this.dragHv = null; this.reset(); return true; }
    this.p.h = clamp(Math.round((vw.oy - y) / vw.s * 20) / 20, 0.1, Math.min(+(4 * this.p.R).toFixed(2), vw.hv));
    this.phase = 'hold'; this.s = -this.entryU(this.p.h); this.v = 0; this.fl = null; this.derive();
    return true;
  },
  params() {
    return [
      { key: 'R', he: 'רדיוס המעגל', sym: 'R', unit: 'm', min: 0.5, max: 2, step: 0.05, dec: 2 },
      { key: 'h', he: this.o.mode === 'track' ? 'גובה השחרור' : 'גובה שקול למהירות בתחתית', sym: 'h', unit: 'm', min: 0.1, max: +(4 * this.p.R).toFixed(2), step: 0.05, dec: 2 },
      { key: 'm', he: 'מסה', sym: 'm', unit: 'kg', min: 0.1, max: 5, step: 0.1, dec: 1 }
    ];
  },
  onParam(k) { if (k === 'R') this.p.h = Math.min(this.p.h, +(4 * this.p.R).toFixed(2)); this.reset(); },
  onOption() { this.reset(); },
  forceKeys() { return ['mg', this.o.mode === 'track' ? 'N' : 'T']; },
  extraKeys() { return ['sum', 'aR', 'at', 'a']; },
  /* track geometry: straight incline -> fillet arc -> short flat -> loop -> exit flat.
     s is the arc length; s = 0 at the loop bottom, s < 0 on the entry track. */
  geo() { const R = this.p.R; return { R, d: 0.5 * R, rf: R, b: this.BETA }; },   // fillet radius = R, so the largest force is N at the loop bottom
  entryU(y) {
    const { d, rf, b } = this.geo(), ya = rf * (1 - Math.cos(b));
    if (y <= ya) return d + rf * Math.acos(clamp(1 - y / rf, -1, 1));
    return d + rf * b + (y - ya) / Math.sin(b);
  },
  pt(s) {
    const { R, d, rf, b } = this.geo();
    if (this.o.mode === 'string' || (s >= 0 && s <= TAU * R)) {
      const f = s / R; return { x: R * Math.sin(f), y: R * (1 - Math.cos(f)), tx: Math.cos(f), ty: Math.sin(f), rho: R, loop: true, phi: f };
    }
    if (s > TAU * R) return { x: s - TAU * R, y: 0, tx: 1, ty: 0, rho: Infinity };
    const u = -s;
    if (u <= d) return { x: -u, y: 0, tx: 1, ty: 0, rho: Infinity };
    if (u <= d + rf * b) { const g = (u - d) / rf; return { x: -d - rf * Math.sin(g), y: rf * (1 - Math.cos(g)), tx: Math.cos(g), ty: -Math.sin(g), rho: rf }; }
    const w = u - d - rf * b;
    return { x: -d - rf * Math.sin(b) - w * Math.cos(b), y: rf * (1 - Math.cos(b)) + w * Math.sin(b), tx: Math.cos(b), ty: -Math.sin(b), rho: Infinity };
  },
  reset() {
    this.phase = 'run'; this.fl = null; this.wait = 0; this.cache = null; this.drag = false; this.dragHv = null;
    if (this.o.mode === 'track') { this.s = -this.entryU(this.p.h); this.v = 0; }
    else { this.s = 0; this.v = Math.sqrt(2 * UI.g * this.p.h); }
    this.derive();
  },
  /** detachment point (N = 0) and the following parabola; cached per parameter set */
  detachInfo() {
    const p = this.p, g = UI.g, R = p.R, key = R + '|' + p.h + '|' + g;
    if (this.cache && this.cache.key === key) return this.cache.val;
    let val = null;
    if (p.h > R * 1.0005 && p.h < 2.5 * R - 1e-9) {
      const c = clamp(-2 * (p.h - R) / (3 * R), -1, 1), f = Math.acos(c), vd = Math.sqrt(Math.max(0, -g * R * c));
      const x0 = R * Math.sin(f), y0 = R * (1 - c), vx = vd * Math.cos(f), vy = vd * Math.sin(f);
      const path = [[x0, y0]]; let t = 0, tLand = 0;
      for (let i = 1; i < 6000; i++) {
        t = i * 0.002; const x = x0 + vx * t, y = y0 + vy * t - 0.5 * g * t * t;
        if (i % 4 === 0) path.push([x, y]);
        tLand = t;

  },
  derive() {
    const p = this.p, g = UI.g, R = p.R, d = this.d = {};
    d.mg = p.m * g; d.E = p.m * g * p.h; d.vb = Math.sqrt(2 * g * p.h); d.vcrit = Math.sqrt(g * R); d.hmin = 2.5 * R;

  },
  step(dt, dtReal) {

  draw(ctx, W, H) {

    line(ctx, 14, hl[1], xe, hl[1], '#607d8b', 1.6, [8, 5]);
    label(ctx, 'h = ' + num(p.h) + ' m', Math.min(xe + 8, W - 176), hl[1] + up * 10, { size: 14, align: 'left', color: '#37474f' });

    if (track) {
      ctx.save(); ctx.strokeStyle = '#455a64'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

const SCENARIOS = [Disk, Pendulum, Bank, Turn, Loop];

/* =====================================================================
   5. UI WIRING
   ===================================================================== */
const cv = $('#cv'), ctx = cv.getContext('2d');
let cssW = 800, cssH = 500, dpr = 1;
const inputs = {};                 // slider elements of the active scenario, by key

function fitCanvas() {
  const r = $('#wrap').getBoundingClientRect();
  cssW = Math.max(320, r.width); cssH = Math.max(300, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
}

function buildTabs() {
  const nav = $('#tabs');
  SCENARIOS.forEach((sc, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = (i + 1) + '. ' + sc.title;
    b.addEventListener('click', () => selectScenario(sc));
    sc._tab = b; nav.appendChild(b);
  });
}
function selectScenario(sc) {
  UI.sc = sc;
  SCENARIOS.forEach(s => s._tab.setAttribute('aria-selected', s === sc ? 'true' : 'false'));
  UI.revealed.clear();
  sc.reset(); buildControls(); updateQuizUI();
  cv.style.touchAction = sc.pointer ? 'none' : 'auto'; cv.style.cursor = sc.pointer ? 'grab' : 'default';
}

/** sliders, options, display check boxes and formulas for the active scenario */
function buildControls() {
  const sc = UI.sc, box = $('#params'); box.innerHTML = '';
  for (const k in inputs) delete inputs[k];
  sc.options().forEach(o => {
    const w = document.createElement('div'); w.className = 'opt';
    if (o.type === 'actions') {
      const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = o.he; w.appendChild(cap);
      const row = document.createElement('div'); row.className = 'acts'; row.dir = 'ltr';
      o.choices.forEach(([txt, val]) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = txt;
        b.addEventListener('click', () => { o.run(val); syncControls(); });
        row.appendChild(b);
      });
      w.appendChild(row);
    } else if (o.type === 'seg') {
      const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = o.he; w.appendChild(cap);
      const seg = document.createElement('div'); seg.className = 'seg';
      o.choices.forEach(([val, txt]) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = txt;
        b.setAttribute('aria-pressed', sc.o[o.key] === val ? 'true' : 'false');
        b.addEventListener('click', () => { if (sc.o[o.key] === val) return; sc.o[o.key] = val; optionChanged(); });
        seg.appendChild(b);
      });
      w.appendChild(seg);
    } else {
      const l = document.createElement('label'); l.className = 'chk';
      const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!sc.o[o.key];
      c.addEventListener('change', () => { sc.o[o.key] = c.checked; optionChanged(); });
      const t = document.createElement('span'); t.textContent = o.he;
      l.appendChild(c); l.appendChild(t); w.appendChild(l);
    }
    box.appendChild(w);
  });
  sc.params().forEach(pd => {
    const w = document.createElement('div'); w.className = 'prm';
    const id = 'p_' + sc.id + '_' + pd.key;
    w.innerHTML = '<div class="head"><label for="' + id + '">' + pd.he + ' ' + ltr('<i style="font-family:\'Cambria Math\',\'Times New Roman\',serif">' + pd.sym + '</i>') +
      '</label><span class="val ltr"></span></div>';
    const inp = document.createElement('input'); inp.type = 'range'; inp.id = id;
    inp.min = pd.min; inp.max = pd.max; inp.step = pd.step; inp.value = sc.p[pd.key];
    inp.addEventListener('input', () => {
      sc.p[pd.key] = clamp(parseFloat(inp.value), pd.min, +inp.max);
      if (sc.onParam) sc.onParam(pd.key);
      sc.derive(); syncControls();
    });
    w.appendChild(inp); box.appendChild(w);
    inputs[pd.key] = { inp, out: w.querySelector('.val'), pd };
  });
  syncControls(); buildShowList();
  $('#formulas').innerHTML = sc.formulas();
}
/** refresh slider ranges / values / value labels (ranges may depend on other parameters) */
function syncControls() {
  const sc = UI.sc;
  sc.params().forEach(pd => {
    const e = inputs[pd.key]; if (!e) return;
    if (+e.inp.max !== pd.max) e.inp.max = pd.max;
    if (parseFloat(e.inp.value) !== sc.p[pd.key]) e.inp.value = sc.p[pd.key];
    e.out.textContent = num(sc.p[pd.key], pd.dec) + (pd.unit ? ' ' + pd.unit : '');
  });
}
function optionChanged() {
  const sc = UI.sc;
  if (sc.onOption) sc.onOption();
  UI.revealed.clear(); sc.reset(); buildControls(); updateQuizUI();
}
function buildShowList() {
  const sc = UI.sc, box = $('#showList'); box.innerHTML = '';
  const add = (key, text, color, acc) => {
    const l = document.createElement('label'); l.className = 'chk';
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = UI.show[key] !== false;
    c.addEventListener('change', () => { UI.show[key] = c.checked; });
    l.appendChild(c);
    if (color) { const s = document.createElement('span'); s.className = 'sw' + (acc ? ' acc' : ''); s.style.background = color; s.style.borderColor = color; l.appendChild(s); }
    const t = document.createElement('span'); t.innerHTML = text; l.appendChild(t);
    box.appendChild(l);
  };
  // single forces (and the extra accelerations of the loop); the common switches are the chips above the canvas
  sc.forceKeys().concat(sc.extraKeys().filter(k => k === 'at' || k === 'a')).forEach(k => add(k, VEC[k].he + ' ' + ltr('<i>' + VEC[k].html + '</i>'), VEC[k].color, VEC[k].acc));
}
function buildLegend() {
  const f = $('#legend'); f.innerHTML = '<span>מקרא:</span>';
  Object.keys(VEC).forEach(k => {
    const V = VEC[k], d = document.createElement('span'); d.className = 'it';
    d.innerHTML = '<span class="sw' + (V.acc ? ' acc' : '') + '" style="background:' + V.color + ';border-color:' + V.color + '"></span>' +
      '<span class="sy ltr" style="color:' + V.color + '">' + V.html + '</span><span>' + V.he + '</span>';
    f.appendChild(d);
  });
  const n = document.createElement('span'); n.className = 'it'; n.style.color = '#5b6b78';
  n.textContent = '(כוחות – חץ מלא; תאוצות – חץ מקווקו וחלול)'; f.appendChild(n);
}

/* live numbers */
let roSig = '';
function updateReadouts() {
  const rows = UI.sc.readouts(), box = $('#readouts');
  const sig = UI.sc.id + '|' + rows.map(r => r[0] + r[1]).join('|');
  if (sig !== roSig) {
    roSig = sig; box.innerHTML = '';
    rows.forEach(r => {
      const d = document.createElement('div'); d.className = 'row';
      const col = r[3] ? VEC[r[3]].color : '#263238';
      d.innerHTML = '<span class="he">' + r[0] + '</span><span class="sy ltr" style="color:' + col + '">' + r[1] + '</span><span class="vl ltr"></span>';
      box.appendChild(d);
    });
  }
  const els = box.querySelectorAll('.vl');
  rows.forEach((r, i) => {
    const txt = !UI.show.nums ? '•••' : (UI.quiz && r[3] && !UI.revealed.has(r[3])) ? '?' : r[2];
    if (els[i].textContent !== txt) els[i].textContent = txt;
  });
}
let stSig = '';
function updateStatus() {
  const st = UI.sc.status(), sig = st.lvl + st.html;
  if (sig === stSig) return; stSig = sig;
  const e = $('#status'); e.className = 'status' + (st.lvl === 'bad' ? ' bad' : st.lvl === 'info' ? ' info' : ''); e.innerHTML = st.html;
}

/* class-question mode */
function quizKeys() { return UI.sc.forceKeys().concat(UI.sc.extraKeys()); }
function updateQuizUI() {
  $('#bQuiz').setAttribute('aria-pressed', UI.quiz ? 'true' : 'false');
  $('#bQuiz').textContent = UI.quiz ? 'סיום – חזרה לתצוגה רגילה' : 'הסתר וקטורים – שרטטו בעצמכם';
  const keys = quizKeys(), left = keys.filter(k => !UI.revealed.has(k));
  $('#bNext').disabled = !UI.quiz || left.length === 0;
  $('#bAll').disabled = !UI.quiz || left.length === 0;
  $('#quizInfo').innerHTML = UI.quiz ? ('נחשפו ' + ltr(String(keys.length - left.length) + ' / ' + keys.length) +
    (left.length ? '' : ' – כל הווקטורים מוצגים')) : '';
}
$('#bQuiz').addEventListener('click', () => { UI.quiz = !UI.quiz; UI.revealed.clear(); updateQuizUI(); });
$('#bNext').addEventListener('click', () => { const k = quizKeys().find(x => !UI.revealed.has(x)); if (k) UI.revealed.add(k); updateQuizUI(); });
$('#bAll').addEventListener('click', () => { quizKeys().forEach(k => UI.revealed.add(k)); updateQuizUI(); });

/* display chips above the canvas */
document.querySelectorAll('#chips .chip').forEach(b => {
  const k = b.dataset.k;
  b.setAttribute('aria-pressed', UI.show[k] !== false ? 'true' : 'false');
  b.addEventListener('click', () => { UI.show[k] = !(UI.show[k] !== false); b.setAttribute('aria-pressed', UI.show[k] ? 'true' : 'false'); });
});
/* pointer: scenarios may react to dragging on the canvas (loop: release height) */
function ptr(type, e) {
  const sc = UI.sc; if (!sc.pointer) return;
  const r = cv.getBoundingClientRect();
  if (sc.pointer(type, e.clientX - r.left, e.clientY - r.top)) {
    if (type === 'down' && cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
    syncControls(); e.preventDefault();
  }
}
cv.addEventListener('pointerdown', e => ptr('down', e));
cv.addEventListener('pointermove', e => ptr('move', e));
cv.addEventListener('pointerup', e => ptr('up', e));
cv.addEventListener('pointercancel', e => ptr('up', e));
/* space bar = play / pause */
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || /^(INPUT|BUTTON|SUMMARY|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  e.preventDefault(); setRunning(!UI.running);
});

/* transport */
function setRunning(r) { UI.running = r; $('#bPlay').textContent = r ? '⏸ עצור' : '▶ הפעל'; }
$('#bPlay').addEventListener('click', () => setRunning(!UI.running));
$('#bStep').addEventListener('click', () => { setRunning(false); UI.sc.step(1 / 30, 1 / 30); });
$('#bReset').addEventListener('click', () => { UI.sc.reset(); });
$('#spd').addEventListener('input', e => { UI.speed = parseFloat(e.target.value) || 1; $('#spdVal').textContent = '×' + num(UI.speed); });
$('#gSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  UI.g = parseFloat(b.dataset.g);
  $('#gSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  if (UI.sc.id === 'loop') UI.sc.reset(); else UI.sc.derive();
}));

/* main loop */
let last = 0;
function frame(now) {
  const dtReal = clamp((now - last) / 1000, 0, 0.05); last = now;
  const sc = UI.sc;
  if (UI.running) sc.step(dtReal * UI.speed, dtReal); else sc.derive();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  sc.draw(ctx, cssW, cssH);
  updateReadouts(); updateStatus();
  requestAnimationFrame(frame);
}

/* start */
buildTabs(); buildLegend(); fitCanvas();
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe($('#wrap'));
window.addEventListener('resize', fitCanvas);
setRunning(true);
selectScenario(Disk);
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
